[workspace]
resolver = "3"
# Code-bearing packages (PROP-024 §2.4) carry their own Cargo workspaces; the
# materialised install slots under vibedeps/ do too. Exclude both trees so this
# root workspace does not try to absorb them, while members below still path-dep
# into them.
exclude = ["vibevm"]
members = [
    "crates/progress-core",
    "crates/vibe-actions",
    "crates/vibe-settings",
    "crates/vibe-cli",
    "crates/vibe-core",
    "crates/vibe-facts",
    "crates/vibe-graph",
    "crates/vibe-index",
    "crates/vibe-install",
    "crates/vibe-registry",
    "crates/vibe-resolver",
    "crates/vibe-llm",
    "crates/vibe-mcp",
    "crates/vibe-check",
    "crates/vibe-publish",
    "crates/vibe-spec",
    "crates/vibe-specdoc",
    "crates/vibe-test-support",
    "crates/vibe-trace",
    "crates/vibe-wire",
    "crates/vibe-workspace",
    "xtask",
]
default-members = [
    "crates/progress-core",
    "crates/vibe-actions",
    "crates/vibe-settings",
    "crates/vibe-cli",
    "crates/vibe-core",
    "crates/vibe-facts",
    "crates/vibe-graph",
    "crates/vibe-index",
    "crates/vibe-install",
    "crates/vibe-registry",
    "crates/vibe-resolver",
    "crates/vibe-llm",
    "crates/vibe-mcp",
    "crates/vibe-check",
    "crates/vibe-publish",
    "crates/vibe-spec",
    "crates/vibe-specdoc",
    "crates/vibe-test-support",
    "crates/vibe-trace",
    "crates/vibe-wire",
    "crates/vibe-workspace",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
authors = ["Oleg Chirukhin"]
license-file = "LICENSE.md"
publish = false
repository = "https://gitverse.ru/vibevm/vibevm"
homepage = "https://gitverse.ru/vibevm/vibevm"
description = "The disciplined runtime for spec-driven vibecoding"
keywords = ["spec-driven", "ai", "cli", "package-manager"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Local crates
progress-core = { path = "crates/progress-core", version = "1.0.0" }
vibe-actions = { path = "crates/vibe-actions", version = "1.0.0" }
vibe-settings = { path = "crates/vibe-settings", version = "1.0.0" }
vibe-core = { path = "crates/vibe-core", version = "1.0.0" }
vibe-facts = { path = "crates/vibe-facts", version = "1.0.0" }
vibe-graph = { path = "crates/vibe-graph", version = "1.0.0" }
vibe-index = { path = "crates/vibe-index", version = "1.0.0" }
vibe-install = { path = "crates/vibe-install", version = "1.0.0" }
vibe-registry = { path = "crates/vibe-registry", version = "1.0.0" }
vibe-resolver = { path = "crates/vibe-resolver", version = "1.0.0" }
vibe-llm = { path = "crates/vibe-llm", version = "1.0.0" }
vibe-mcp = { path = "crates/vibe-mcp", version = "1.0.0" }
vibe-check = { path = "crates/vibe-check", version = "1.0.0" }
vibe-publish = { path = "crates/vibe-publish", version = "1.0.0" }
vibe-spec = { path = "crates/vibe-spec", version = "1.0.0" }
# The PROP-045 pivot crate: document IR + MD/XML frontends and backends.
vibe-specdoc = { path = "crates/vibe-specdoc", version = "1.0.0" }
# Test-only: linking it isolates the test process's per-user settings home
# before the first `#[test]` runs (DRIFT-020). Consume as a dev-dependency.
vibe-test-support = { path = "crates/vibe-test-support", version = "1.0.0" }
# The host's traceability-explain capability (PROP-014 §2.6): build the
# specmap fresh and render a target's subgraph. Shared one-to-one by the
# `vibe explain` CLI surface and the `explain` MCP tool.
vibe-trace = { path = "crates/vibe-trace", version = "1.0.0" }
vibe-wire = { path = "crates/vibe-wire", version = "1.0.0" }
vibe-workspace = { path = "crates/vibe-workspace", version = "1.0.0" }

# Code-bearing package crates (PROP-024): the ENGINE-CONFORM + specmap
# traceability toolchains live in the discipline packages, consumed by
# external path-dep. The vibevm root excludes packages/ + vibedeps/, so these
# resolve into each package's own Cargo workspace. Path-only — the crate
# versions are the packages' concern. The neutral engine crates
# (core-ai-native-conform, core-ai-native-specmap, core-ai-native-specmark) are
# AUTHORED in flow:org.vibevm.ai-native/core-ai-native and consumed here through the Rust
# stack's VENDORED copies (crates/vendor/*, `cargo xtask sync-engines`), so the
# whole root dependency graph builds ONE copy of each engine — the same copy the
# stack's own crates use. They keep their short local dep KEYS (`conform-core`,
# `specmap-core`, `specmark`) via Cargo's `package =` rename so the ~300
# `specmark::scope!` dogfood sites + xtask stay untouched (PROP-028 §2.4: the
# crate IDENTITY carries the family stem; the use-path alias does not).
conform-core = { package = "core-ai-native-conform", path = "vibevm/vibepacks/org.vibevm.ai-native/rust-ai-native-lang/v1.0.0/crates/vendor/core-ai-native-conform" }
rust-ai-native-conform-frontend = { path = "vibevm/vibepacks/org.vibevm.ai-native/rust-ai-native-lang/v1.0.0/crates/rust-ai-native-conform-frontend" }
rust-ai-native-conform = { path = "vibevm/vibepacks/org.vibevm.ai-native/rust-ai-native-lang/v1.0.0/crates/rust-ai-native-conform" }
rust-ai-native-cli = { path = "vibevm/vibepacks/org.vibevm.ai-native/rust-ai-native-lang/v1.0.0/crates/rust-ai-native-cli" }
rust-ai-native-env-audit = { path = "vibevm/vibepacks/org.vibevm.ai-native/rust-ai-native-lang/v1.0.0/crates/rust-ai-native-env-audit" }
specmap-core = { package = "core-ai-native-specmap", path = "vibevm/vibepacks/org.vibevm.ai-native/rust-ai-native-lang/v1.0.0/crates/vendor/core-ai-native-specmap" }
rust-ai-native-specmap = { path = "vibevm/vibepacks/org.vibevm.ai-native/rust-ai-native-lang/v1.0.0/crates/rust-ai-native-specmap" }
specmark = { package = "core-ai-native-specmark", path = "vibevm/vibepacks/org.vibevm.ai-native/rust-ai-native-lang/v1.0.0/crates/vendor/core-ai-native-specmark" }

# Third-party (all permissive licenses — PROP-000 §3)
# The XML reader/writer of the PROP-045 spec-source dialect (vibe-specdoc).
# MIT. One new dependency, decided on the record: PROP-045
# ##XML-PARSER-DEPENDENCY (alternatives — roxmltree, xml-rs, hand-rolling —
# weighed and rejected there).
quick-xml = "0.41.0"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
anyhow = "1"
arboard = "3.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.23"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
console = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
semver = { version = "1", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
# `preserve_order` keeps a parsed JSON document's existing key order on
# round-trip (Map → IndexMap), so merging vibevm's MCP entry into a
# user's `~/.claude.json` / agent config appends rather than alphabetising
# their whole file. The committed gate artefacts are immune: specmap.json
# serialises derived structs + pre-sorted Vecs, vibe.lock is TOML.
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2"
glob = "0.3"
resolvo = "0.11"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }

# `vibe tree` interactive TUI (PROP-036 §2.11). rat-salsa event-loop + rat-widget
# table, over the modular ratatui split (core / widgets / crossterm) that
# rat-salsa / rat-widget pull — pinned here too so the whole graph builds ONE
# shared copy and their types are nameable from vibe-cli. All MIT or
# MIT/Apache-2.0 (PROP-000 §3 permissive).
rat-salsa = "4.0"
rat-widget = "3.2"
ratatui-core = "0.1"
ratatui-widgets = "0.3"
ratatui-crossterm = "0.1"

# `vibe aiui inspect` attaches to the running vibeterm Electron page over the
# Chrome DevTools Protocol (chromiumoxide) to read its live state — the real
# xterm grid cols/cell metrics and DOM layout — without screenshot OCR. tokio
# (below, in the dev section) is the async runtime chromiumoxide
# (tokio-tungstenite) needs; we drive it from the otherwise-blocking CLI via a
# current-thread `block_on`. All MIT/Apache-2.0 (chromiumoxide MIT, tokio MIT,
# futures MIT/Apache-2.0 — PROP-000 §3).
chromiumoxide = "0.9"
futures = "0.3"

# Dev / test
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# JSON-Schema validator for the `vibe tree --json` golden (PROP-036). MIT.
# default-features off: the schema is self-contained (internal `$defs` only),
# so the HTTP/file `$ref` resolvers — and their aws-lc-rs / reqwest toolchain
# — are not needed.
jsonschema = { version = "0.47", default-features = false }
trybuild = "1"
proptest = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
