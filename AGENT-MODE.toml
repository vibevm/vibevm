# Глобальный режим взаимодействия агента с человеком (владельческий
# переключатель, директива 2026-08-20). Действует на ЦЕНТРАЛЬНОГО агента
# любого харнесса, работающего в этом репозитории.
#
# Переключатель принадлежит ВЛАДЕЛЬЦУ: правьте строку `mode` в любой момент
# (или скажите в чате — агент обновляет файл немедленно, состояние обязано
# пережить компактификацию и смену сессии). Агент перечитывает файл на буте
# (лейн CLAUDE.md) и после каждой компактификации (хук
# .claude/hooks/post-compact-reorient.ps1 печатает действующую строку).
#
#   "auto"   — полностью автоматический режим. Центральный агент пишет
#              МИНИМУМ текста пользователю: короткий трекинг прогресса
#              (что село, что в полёте, что дальше — телеграфно), без
#              развёрнутых сводок и пересказов: output-токены дороже всего
#              остального, а несущая информация уже живёт в долговечных
#              домах (_STATUS/LOG ТЗ, коммиты, отчёты воркеров).
#              НЕСЖИМАЕМЫЙ ПОЛ (режим не молчание): блокеры
#              СТОП-ВЛАДЕЛЕЦ, владельческие развилки, инциденты,
#              краткий TL;DR на границе слайса — всегда; и ПРЯМОЙ ВОПРОС
#              владельца всегда получает полный ответ (это работа, а не
#              нарратив).
#   "collab" — режим совместной разработки с человеком: обычные
#              объяснения, варианты, рассуждения по запросу; уместные
#              развёрнутые ответы.
#
# Субагентов переключатель НЕ касается: воркер (claudez / codexrunner /
# любой будущий) ВСЕГДА работает в субагентском режиме — его экранный текст
# не читает никто, деливерабл только артефакты. Каждый пакет/указатель
# несёт обязательную клаузу субагентского режима:
# campaigns/packages-2026-09/SUBAGENT-LAUNCHERS.md ##subagent-quiet-clause.
mode = "auto"
