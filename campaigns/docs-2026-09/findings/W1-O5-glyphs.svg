<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Kind glyphs for the site's cards (owner's remark 11, 2026-09-14): one symbol per package kind,
    24x24, drawn with strokes in currentColor so both themes and every size use the same outline.
    flow: a course that turns and keeps going. feat: a spark, one thing a product does. stack: layers.
    tool: a wrench. mcp: a plug an agent connects to. lang: braces, the shape of written code.
    doc: a page with lines. app: a window with its own frame.
  -->
  <symbol id="kind-flow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5h8.5a3.5 3.5 0 0 1 0 7h-2a3.5 3.5 0 0 0 0 7H20"/>
    <path d="M17 16l3 3-3 3"/>
    <circle cx="4" cy="5" r="1.25" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="kind-feat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>
  </symbol>
  <symbol id="kind-stack" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4l8 4-8 4-8-4z"/>
    <path d="M4 12l8 4 8-4"/>
    <path d="M4 16l8 4 8-4"/>
  </symbol>
  <symbol id="kind-tool" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 7.5a5 5 0 0 1-6.6 6.6L7 21a2 2 0 0 1-3-3l6.9-6.9a5 5 0 0 1 6.6-6.6l-3 3 .5 2.5 2.5.5z"/>
  </symbol>
  <symbol id="kind-mcp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 3v4M15 3v4"/>
    <path d="M6 7h12v3a6 6 0 0 1-12 0z"/>
    <path d="M12 16v5"/>
  </symbol>
  <symbol id="kind-lang" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 4C6.5 4 5.5 5 5.5 7v3c0 1-.8 2-2 2 1.2 0 2 1 2 2v3c0 2 1 3 3 3"/>
    <path d="M15.5 4c2 0 3 1 3 3v3c0 1 .8 2 2 2-1.2 0-2 1-2 2v3c0 2-1 3-3 3"/>
  </symbol>
  <symbol id="kind-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h8l5 5v13H6z"/>
    <path d="M14 3v5h5"/>
    <path d="M9 12h7M9 16h7"/>
  </symbol>
  <symbol id="kind-app" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2"/>
    <path d="M3 9.5h18"/>
    <path d="M6.25 7.25h.01M9.25 7.25h.01"/>
  </symbol>
</svg>
