# The facts scope (PROP-043 §6, the facts home) — wave 1 of the spec-actualization
# campaign: the host `spec/` tree only. `packages/` waves come later;
# widen this include list when the owner opens wave 2.
#
# LAYOUT NOTE (PROP-052, R4 flip 2026-08-24): the LIVE globs below spell the
# new roots — `spec/` → `vibevm/vibespecs/`, `packages/` → `vibevm/vibepacks/`
# (and a package's own specs sit at `<slot>/vibevm/vibespecs/`). The prose in
# this file is dated chronicle and keeps the root names of its era; only the
# `include` / `exclude` arrays are live configuration.
#
# The generated boot artifacts `spec/boot/STATIC.md` + `spec/boot/INDEX.md`
# are OUT of scope (owner ruling 2026-07-24, campaign plan LOG): they are
# rewritten by `vibe install`, so markup written into them dies on regen.
# `spec/WAL.md` is OUT for the same reason in session form (owner ruling
# 2026-07-24, second): the checkpoint is rewritten wholesale every
# session-end — markup cannot live in it. The authored boot snippets
# (00-core, 90-user) are NOT generated (user-owned; vibe never writes
# them) and stay observed via `spec/boot/[0-9]*.md`.
# The legacy dirs (terraforms, research, neworder, discipline) left the
# spec tree for root `legacy-spec/` in Phase L (relocated 2026-07-25,
# per the owner rulings of the same day): long-executed refactoring
# plans, research studies, and the superseded Discipline copy —
# historical records, not living contracts; the campaign does not mark
# or verify them. The one carve-out is the active campaign plan, which
# stays at `spec/terraforms/SPEC-ACTUALIZATION-CAMPAIGN-v0.1.md`
# (owner ruling: the §6 monthly recurrence consumes it in place).
# Re-add a glob here if an archived doc is ever promoted back to
# living-contract status.
# §4 was include-ONLY by design until 2026-07-26, so exclusions were
# expressed by enumerating the includes; a new spec/ subtree or top-level
# spec doc must still be added here explicitly — review at batch boundaries.
# DRIFT-024 amended that: an `exclude` key now exists (bottom of this file)
# for what an include glob cannot say — "everything under this subtree
# except these named files". The design's PURPOSE is unchanged, since an
# enumerated exclude is as explicit and reviewable as an enumerated
# include; see PROP-043 ##CONFIG-EXCLUDE (modules/vibe-facts) for the guard rails.
# WAVE 2 opened 2026-07-26 (PACKAGES-ACTUALIZATION-CAMPAIGN ratified): the two
# authored package namespaces join the scope. The host's 58 files STAY in
# scope — wave 2 does not un-measure wave 1, and both corpora share one
# `progress check` gate that must stay at 0.
# Out of scope and deliberately so: `packages/org.vibevm.fractality/**` (its
# own specspace, its own boot contract and WAL) and `vibedeps/**` (regenerated
# consumer copies of the same packages — marking a copy is marking nothing).
#
# AUDITED 2026-07-26 on an owner challenge ("did you really keep everything
# generated out?"). Result across all 344 observed files: exactly two top-level
# roots (`packages`, `spec`), and NO path segment named target, vibedeps,
# node_modules, vendor, .vibe, refs, campaigns, fixtures, dist, build,
# generated or .git — `DEFAULT_EXCLUDES` (scope.rs) holds those always-on,
# even under an explicit include.
#
# The accounting closes exactly, so no future session has to re-derive it.
# `packages/**` holds **1 370** `.md` files on disk:
#     970  inside an excluded directory  — .vibe/cache 563, vibedeps 376,
#          refs 23, fixtures 8.  (vendor / target / node_modules contribute
#          ZERO .md, so their exclusion is belt-and-braces, not load-bearing.)
#     114  packages/org.vibevm.fractality/**  — dropped by the INCLUDE globs
#          rather than by an exclusion: its own specspace, own boot contract
#          and WAL (plan §1). Deliberate.
#     286  observed  (250 after DRIFT-024's exclusions land — see below).
#     ---
#   1 370  total, and **0** observed files sit inside any excluded directory.
# So ~71 % of the markdown under packages/ is machine-copied dependency trees
# and is correctly invisible. DRIFT-024 then removed 36 more (33 LICENSE.md by
# the file-name default, 3 derived indexes by the `exclude` globs below), so
# the corpus is 308 files and the 8 463 unmarked facts are authored text only.
#
# Two leaks the always-on list did NOT catch, both filed and both since fixed:
#   F-071 — `spec/cards/INDEX.md` in all three language stacks is a DERIVED
#           index ("hand edits are a defect", its own words). Markup there
#           dies on regen. Wave 1 dodged the same problem for its boot
#           artifacts via the `spec/boot/[0-9]*.md` glob; `packages/**/*.md`
#           has no equivalent trick and §4 is include-only by design.
#   F-070 — 33 `LICENSE.md` files, 264 paragraphs of verbatim UPL text.
# BOTH LANDED 2026-07-26 (DRIFT-024), by two different mechanisms because the
# two classes are different. F-070 went into code: `LICENSE.md` is now a
# `DEFAULT_EXCLUDE_FILES` entry in `crates/progress-core/src/scope.rs`,
# always-on like `refs` and for the same reason — verbatim third-party text
# the observing project neither authored nor owns — and project-neutral, so
# it belongs to the engine and not to this file. F-071 is project-specific
# and went into the `exclude` key below.
#
# NOTE, and it bites immediately: with two `campaigns/<id>/` zones present, a
# BARE `vibe progress …` no longer resolves a campaign — `resolve_campaign`
# returns the single zone only when exactly one exists, and otherwise drops to
# ad-hoc mode, where reports work and STATE IS SILENTLY NOT WRITTEN. Always
# pass `--campaign campaigns/packages-2026-09` (or the wave-1 zone) from here on.
schema = 1
include = [
    "vibevm/vibespecs/boot/[0-9]*.md",
    "vibevm/vibespecs/common/**/*.md",
    "vibevm/vibespecs/design/**/*.md",
    "vibevm/vibespecs/manual-tests/**/*.md",
    "vibevm/vibespecs/modules/**/*.md",
    "vibevm/vibepacks/org.vibevm.world/**/*.md",
    "vibevm/vibepacks/org.vibevm.ai-native/**/*.md",
]

# Enumerated exclusions, applied after the includes above (DRIFT-024 §4.2).
# The include-only design's purpose is that nothing is observed by accident,
# and an enumerated exclude list serves that purpose exactly as well as an
# enumerated include list — both are explicit and both are reviewable. It is
# not a wildcard escape hatch: keep every pattern narrow enough to name the
# files it removes, and add one only for a file that must never carry markup.
# A pattern that stops matching anything is warned about by name on every
# `vibe progress` run — delete it when that happens rather than leaving a
# dead exclusion behind.
#
# `spec/cards/INDEX.md` (rust v0.7.0, typescript v0.6.0, go v0.1.0) is a
# DERIVED index — "Generated/maintained as a derived index (A2/R-030); hand
# edits are a defect", in its own words. Markup written there dies at the
# next regeneration, exactly as it would in the boot artifacts wave 1 kept
# out. The three files leave; the authored `spec/cards/*.md` cards beside
# them are contracts and STAY observed — this pattern must never be widened
# to `cards/**` or to `**/INDEX.md`.
exclude = [
    "vibevm/vibepacks/**/vibevm/vibespecs/cards/INDEX.md",
    # SUPERSEDED VERSION SLOTS — frozen history, not living contracts.
    # Plan §3.3 rules that a superseded slot is "marked, never verified",
    # because verifying frozen history costs what a live contract costs and
    # buys nothing. `check --exhaustive` cannot express that: it demands a
    # marker on every paragraph, and one document-level marker does not
    # satisfy it. So the slot leaves the corpus instead.
    # These two are 33 files and 1 908 facts — 23 % of Phase B's whole
    # workload, on text nothing resolves to.
    # Owner policy (2026-07-26) makes this a rare case rather than a growing
    # one: a package version is NOT bumped on every change. The source text is
    # edited in place and `vibe update` re-materialises consumers, so new
    # superseded slots appear only at a real release — which is also why the
    # -lang re-mint was called off rather than executed.
    "vibevm/vibepacks/org.vibevm.ai-native/core-ai-native/v0.7.0/**",
    "vibevm/vibepacks/org.vibevm.world/redbook/v0.1.0/**",
    # LEGACY LANGUAGE PROJECTIONS — frozen history, same category as a
    # superseded version slot and excluded for the same reason: §3.3 rules them
    # "marked, never verified", and `--exhaustive` cannot express that (it
    # demands a marker per paragraph; one document marker does not satisfy it).
    # OWNER RULING 2026-07-26, F-080: «legacy-projections - это замороженная
    # история. Мы когда-нибудь покроем эти языки, но еще не сейчас. Сейчас у нас
    # есть активные rust, typescript и go.» The eleven v0.1 guides (C++ ×3,
    # Java ×4, Kotlin, Python, Go, TypeScript) are 1 264 lines of substantive
    # normative prose that NOTHING in the living corpus cites; the go stack's
    # guide says GUIDE-GO-v0.1 «stays, untouched» there, and the typescript
    # stack declares GUIDE-TYPESCRIPT-v0.1 superseded. The three active
    # languages are served by their own `-lang` stacks, whose guides ARE
    # observed.
    # Genre-shaped like the `cards/INDEX.md` pattern above rather than pinned to
    # one version slot, so the next core-ai-native version does not silently
    # re-admit 1 264 lines of frozen text. It matches exactly one live directory
    # today; a pattern that stops matching is warned about by name on every run.
    # Re-add the languages here as includes when a stack for them lands — that
    # is the owner's "когда-нибудь", and it is an addition, not a revert.
    "vibevm/vibepacks/**/vibevm/vibespecs/legacy-projections/**",
    # THE BOOK — reference depth, not a contract.
    # OWNER RULING 2026-07-26, F-091: «исключи spec/book/**».
    # `flow:redbook` ships the AI-native development book at `spec/book/ru/`
    # (three chapters, 1 209 lines, 375 facts). The package's OWN boot snippet
    # rules it out of standing instructions in as many words: «Do not read the
    # book at session boot — it is reference depth, not standing instructions.»
    # Nothing outside the package cites a chapter.
    # The deciding argument is Phase C, not size: every marker earns a verdict,
    # and `confirmed` has no meaning applied to a paragraph of philosophical
    # prose. We would hit the same wall §3.3 and F-080 hit — `--exhaustive`
    # cannot express "marked, never verified" — with the added cost of minting
    # 375 spec:// addresses on narrative that nothing resolves against.
    # This is NOT the frozen-history category: the book is authored, current,
    # and the source of the discipline's spirit. It is a different genre —
    # lore, in `spec-genres`' sense — and the corpus is for contracts.
    # `spec/book/**` and not `spec/book/ru/**` per the ruling: the edition-plan
    # README goes with the edition it plans.
    # Re-admitting it needs a rule the campaign does not have — "lore is marked
    # but never verified" — and that rule needs tooling, not just a glob.
    "vibevm/vibepacks/**/vibevm/vibespecs/book/**",
    # THE DISCOVERY PROMPT — a payload, not a claim.
    # OWNER RULING 2026-07-27, F-096, asked before B8 was dispatched rather than
    # after it was marked: exclude `DISCOVERY-PROMPT.md` (169 units, 37 % of that
    # batch). The deciding argument is Phase C, the same one that removed the
    # book: every marker earns a verdict, and `confirmed` has no meaning applied
    # to a line of a prompt ADDRESSED TO ANOTHER MODEL. The file is not prose —
    # `<PROMPT_INFO>`, `<VARIABLES>`, macro substitution, and assignments like
    # "LLM = Claude/Haiku/Sonnet/Opus" that a downstream session consumes.
    # The package's own boot snippet rules it out in as many words: "a payload
    # for a fresh session, not standing instructions — do not load it into
    # context outside an explicit deployment request." Nothing outside the
    # package cites it; the single external hit is the generated
    # `spec/boot/STATIC.md`, which is that same snippet compiled into the host's
    # boot lane.
    # THE LINE THIS DRAWS, because the next case will test it: the package's
    # README, boot snippet and `usage.md` all STAY observed — every document
    # that makes a claim ABOUT the artifact is still measured. Only the payload
    # leaves, and it leaves because it asserts nothing this project could be
    # wrong about. That is sharper than "lore is excluded": a document is in the
    # corpus when it asserts something this project could be wrong about.
    # Version-agnostic so a future `discovery-prompt` slot cannot silently
    # re-admit it; NEVER widen this to `flows/**` or to `**/*-PROMPT.md`.
    # The counter-argument is recorded in the campaign LOG rather than won: the
    # artifact is what the package exists to ship, so its corpus is now
    # meta-commentary about something unobserved. The owner accepted that.
    "vibevm/vibepacks/**/vibevm/vibespecs/flows/discovery-prompt/DISCOVERY-PROMPT.md",
]
