# ── Requirements metadata answer (1 JTD), PROP-054 §14.7 / R7.5 ─────────────
# The R7.5 read-only requirements answer: one bounded document an external
# orchestrator reads to learn what this project declares and recorded about
# its facts. Deliberately NOT named `cli-*`: the same generated root is
# returned by the shared `vibe_requirements::query` library, by the CLI
# `vibe requirements` projection and by MCP `requirements_query`, so a
# surface-named id would be false on two of the three the day it shipped.
# (`cli-lifecycle-report` above carries exactly that legacy misnaming and is
# no precedent for a new surface.) Computed policy: rebuildable by re-running
# the query (`recoverable = true`), read by scripts, agents and raw
# `curl | jq` (`foreign_parsers = "many"`), so the generated reader stays
# permissive — the strictness this root DOES carry is its ten closed
# vocabularies, its exact member set and the hand-written relational
# validator beside it, never `deny_unknown_fields`.
[format.requirements-report]
epoch = 1
schema = "schemas/requirements_report.jtd.json"
recoverable = true
foreign_parsers = "many"
corpus = "formats/corpora/requirements/e1"
sunset = "none"

# ── Compiler IR pass wire (1 JTD), PROP-054 §7.4.4 `##WHOLE-IR-WIRE` ─────────
# The six manager carriers, one contract, one discriminator, no second
# trace-only IR shape. TODAY this row models exactly one channel: the HOST
# reader — vibe's own R6.2b domain conversion and the R3.4 trace snapshots.
# Nothing foreign parses it yet (native invocation is R5/R6, unbuilt), so the
# reader is strict (`foreign_parsers = "none"` → deny_unknown_fields) and an
# unknown field is a wire bug rather than forward compatibility; version skew
# is governed by `ir_schema` at the manifest gate.
#
# This row does NOT model both native channel directions, and must not be read
# as doing so. When foreign native invocation lands, the request the manager
# hands a plugin acquires genuinely foreign readers while the reply the host
# parses stays ours — the same split `lifecycle-context` (many) /
# `lifecycle-reply` (none) already records. Central integration owes that
# honest representation THEN, without duplicating this IR DTO or schema (one
# schema, two registry roles is the shape to reach for). Until then, do not
# weaken this host reader: a permissive host reader buys nothing today and
# silently drops fields the conversion needs.
[format.compiler-ir]
epoch = 1
schema = "schemas/compiler_ir/e1/ir.jtd.json"
recoverable = true
foreign_parsers = "none"
corpus = "formats/corpora/compiler_ir/e1"
sunset = "none"

# ── Compile trace index (1 JTD), PROP-054 `##OBS-TRACE` / R3.4 ───────────────
# The METADATA half of `.vibe/trace/<run-id>/index.json`: scopes, pass
# invocation events, snapshot FILENAMES and timing aggregates. It embeds no
# IR payload — the snapshots themselves are `compiler_ir/e1` documents, the
# one registered snapshot payload contract. Rebuildable without a human
# (delete the run directory and rerun the compile), and read by developers
# and tools as raw JSON (`curl`/`jq` over a failed run's directory is the
# first debugging instrument) — so `many`, permissive object members, and
# the relational laws live in the hand-written validator beside the
# generated reader, not in a stricter ad-hoc reader (PROP-044 §4.2).
[format.compiler-trace-index]
epoch = 1
schema = "schemas/compiler_trace_index/e1/index.jtd.json"
recoverable = true
foreign_parsers = "many"
corpus = "formats/corpora/compiler_trace_index/e1"
sunset = "none"

