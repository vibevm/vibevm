# formats/REGISTRY.toml — the format registry (PROP-044 §4.1 `##M-FORMAT-REGISTRY`).
#
# Every surface a foreign parser reads is inventoried here. From this file the
# `FormatId` enum is generated (`cargo xtask codegen` →
# `crates/vibe-wire/src/generated/format_id/mod.rs`), so an unregistered format
# is *inexpressible in the type system*, not merely discouraged: an unnumbered
# format is a format that will be broken without anyone noticing.
#
# Read by: the codegen generator (`xtask/src/codegen.rs`), the
# `format_id_completeness` test, and — via the generated `FormatId` — every
# `wire::publish/load(FormatId, …)` call site (the gate G1 of PROP-044 §8).
#
# Per record: `id` (the `[format.<id>]` key), `epoch`, `schema` (a path or
# "none"), `recoverable` (bool), `foreign_parsers` (none | ours | many),
# `corpus` (a path or "none"), `sunset` (a date or "none").
#
# The `recoverable` and `foreign_parsers` axes are not free choices: a format's
# policy is *computed* from them — see PROP-044 §5 `##POLICY-IS-COMPUTED`.
# `recoverable` = rebuildable without a human (delete and reproject from the
# authoritative core, §3); `foreign_parsers` = how many independent parsers read
# it (raw `curl | jq` parsing is assumed — `##RISK-RAW-PARSERS`).
#
# Schema paths for not-yet-built formats (the index catalog, journal, handshake)
# are the plan-assigned paths, recorded here as-is (Ф4.1 / Ф3.1 / Ф6.1).
# `cli-package-tree` points at a JSON Schema 2020-12 file (not JTD); the codegen
# generator leaves it untouched — its routing keys on the `*.jtd.json` suffix.
#
# `narrow-public-gate` is deliberately absent: it does not exist yet and is not
# built by this TZ (D12, wave 3); a variant nothing can use is an inventory of
# the non-existent. It enters on the first line of wave 3.

# ── CLI machine-JSON reports (7 JTD + 1 JSON Schema), PROP-044 §6.5 ──────────
[format.cli-init-report]
epoch = 1
schema = "schemas/init_report.jtd.json"
recoverable = true
foreign_parsers = "many"
corpus = "none"
sunset = "none"

