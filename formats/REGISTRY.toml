# states what a build/package target produced, `deploy_intent` journals what
# an apply is about to touch, `deploy_receipt` records what an applied deploy
# owns. All three are FACT records about runs that already happened — there
# is no source to reproject them from (`recoverable = false`, the same
# computed policy `package-skill-receipt` and `boot-artifact-transaction`
# already carry), and all three are read only by our own engine, so the
# generated readers are strict (`foreign_parsers = "none"` →
# deny_unknown_fields): an unknown member is a wire bug, not forward
# compatibility. Intent and receipt share the `deploy/e1` corpus home — the
# same one-exchange pairing the `lifecycle/e1` home already records for five
# lifecycle records.
