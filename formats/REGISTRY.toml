[format.journal]
epoch = 1
schema = "schemas/journal/e1/journal.jtd.json"
recoverable = false
foreign_parsers = "ours"
# The same corpus: its `state/journal/` shards ARE this format's golden
# bytes, and they are the corpus's authored half — every catalog file
# beside them is projected from these. A record whose bytes the corpus
# carries must name it, or the wire-diff has nowhere to look.
corpus = "formats/corpora/index/e1"
sunset = "none"

