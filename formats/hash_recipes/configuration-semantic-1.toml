id = "configuration-semantic/1"
digest = "sha256"
input = "validated ConfigurationDecl semantic projection"
header = "vibevm.configuration.semantic/v1 followed by NUL"
lengths = "u64 big-endian byte lengths/counts; text UTF-8"
booleans = "one byte 0 or 1; optional values start with presence boolean"
integers = "signed i64 big-endian two's complement (internal digest material, not public wire)"
ordering = "features, groups, parameters and profiles sorted by literal id; all set-valued arrays sorted/deduplicated; maps key-sorted"
fields = "features(id,internal,required,default,parent,requires,guards,effects); groups(id,mode,cardinality,members,defaults-or-fallback,choice-guards); parameters(id,type,required,secret,must_exist,min,max,default,choice-values); profiles(id,features,selections,parameters); config_values"
excluded = "names, descriptions, presentation order, profile.default UI marker, operation inputs and answer secrets"
reference = "crates/vibe-core/src/manifest/configuration/semantic.rs; frozen empty/nonempty golden and semantic discrimination tests"
