# conform.toml — vibevm's own AI-Native Rust discipline policy.
#
# The conform checker (ENGINE-CONFORM v0.1) is config-driven: this file is
# the policy the gate enforces on THIS project. It is vibevm-specific — the
# gated list, the env-read roots, and the exempt table are all about
# vibevm's own code, and TERRAFORM-PLAN-v0.3 §30 records conform.toml as
# staying with the consumer, not moving into the discipline package. A
# consumer of the rust-ai-native stack writes its own conform.toml for its
# own layout. See PROP-024 and discipline://rust-ai-native-lang.
#
# The surface is per-language (B-029/B-034): the root carries only the
# shared budget; each language owns a section of one uniform shape. This
# project is Rust-only, so `[rust]` is the whole policy.

# The per-file line budget (GUIDE-AI-NATIVE-RUST §2).
max_file_lines = 600

[rust]
# Source roots to scan. A `<dir>/*` entry scans each subdir of <dir> as one
# crate; any other entry is a literal crate dir.
roots = ["crates/*", "xtask"]
exclude_substrings = ["/generated/"]

# R-001 flag-sites: cell constructors appear only in the selection registry.
registry_file = "crates/vibe-cli/src/registry.rs"
registry_gated_crate = "vibe-cli"

# Designated audit crates — exempt wholesale from the unsafe and ambient-env
# gates. rust-ai-native-env-audit (the env-mutation audit home) relocated into
# lang:org.vibevm.ai-native/rust-ai-native-lang (PROP-024) and is no longer
# scanned here; the remaining vibevm unsafe sites carry fn-grain
# #[spec(deviates)] testimony.
#
# vibe-test-support is the second audit home, and the narrowest one: a single
# pre-`main` constructor that repoints $VIBE_SETTINGS at a temp dir so no test
# can reach the operator's real `~/.vibe` (DRIFT-020). It cannot use
# rust-ai-native-env-audit's EnvGuard — that guard RESTORES on drop and holds a
# process-wide lock, both wrong for an isolation that must outlive the call and
# never block a test. The mutation is sound for one reason only, recorded at the
# call site: a platform constructor runs single-threaded before `main`.
audit_crates = ["vibe-test-support"]

# Crates under the Class-F/G conform gates (the expand-as-you-conform list —
# a crate enters when its seams are doctested and its error layer carries REQ
# edges).
gated = [
    "progress-core",
    "vibe-core",
    "vibe-actions",
    "vibe-settings",
    "vibe-index",
    "vibe-install",
    "vibe-resolver",
    "vibe-registry",
    "vibe-workspace",
    "vibe-check",
    "vibe-publish",
    "vibe-cli",
    "vibe-mcp",
    "vibe-trace",
]

# Crates whose whole public TYPE surface is gated for compiled doctests (the
# wider pub-doctest lens). vibe-cli is deliberately absent — it is a bin crate
# with no lib target, so `cargo test --doc` cannot compile its examples;
# gating it would enforce uncompiled prose, the opposite of the rule.
gated_pub_doctest = [
    "vibe-core",
    "vibe-mcp",
]

# Files where reading the ambient environment is sanctioned: the env-promotion
# composition root, the per-crate config-resolution points (user-config /
# cache-root / token / git-binary / index-URL discovery), and the surfaces
# whose job is to read or display env. A gated crate reading env in any OTHER
# file fails the gate; extending this list is a deliberate, reviewed decision.
env_roots = [
    "crates/vibe-cli/src/main.rs",
    "crates/vibe-cli/src/output.rs",
    "crates/vibe-cli/src/commands/show/config.rs",
    "crates/vibe-cli/src/commands/tree/tui/settings.rs",
    # `vibe tree` reads $VIBETERM to detect it is running inside the vibeterm
    # desktop terminal (upgrade in place instead of spawning a window) — PROP-042.
    "crates/vibe-cli/src/commands/tree/host.rs",
    # `vibe term` detects the interactive shell ($SHELL / pwsh via ProgramFiles /
    # PATH …) and locates vibeterm ($VIBEVM_VIBETERM) — a launcher whose job is
    # to read the environment for the spawn (PROP-042 §5).
    "crates/vibe-cli/src/commands/term.rs",
    # `vibe aiui` reads the settings dir ($VIBE_SETTINGS / $HOME) to find `~/.vibe/aiui/` — vibeterm's
    # control-session discovery directory (PROP-042 §4).
    "crates/vibe-cli/src/commands/aiui/control.rs",
    # The GUI launchers moved to the vibevm-term products repo; their env-var
    # resolver (`spec://vibe-launcher/PROP-043#resolve`) is no longer in-tree.
    "crates/vibe-core/src/user_config.rs",
    # The settings-dir chokepoint: the ONE place that reads $VIBE_SETTINGS /
    # HOME / USERPROFILE to resolve `~/.vibe`, so every settings path agrees.
    "crates/vibe-core/src/settings.rs",
    "crates/vibe-settings/src/loader.rs",
    "crates/vibe-index/src/scanner/git_cli.rs",
    "crates/vibe-publish/src/post_hook.rs",
    "crates/vibe-publish/src/token.rs",
    "crates/vibe-registry/src/git_backend/shell.rs",
    "crates/vibe-registry/src/git_package_registry/mod.rs",
    "crates/vibe-registry/src/index_client.rs",
    "crates/vibe-registry/src/registry_cache.rs",
]

# Crates deliberately OUTSIDE `gated`, each paired with the reason it has
# not (yet) flipped — a silent exemption reads as a bug, a recorded one as a
# decision. `every_crate_is_gated_or_exempt` keeps this honest against the
# workspace so a new crate cannot slip in unclassified.
[[rust.exempt]]
unit = "vibe-graph"
reason = "M0 stub, no code yet — the task-graph runner per VIBEVM-SPEC §5 is unbuilt; nothing to gate until it lands"

[[rust.exempt]]
unit = "vibe-llm"
reason = "M0 stub, no code yet — providers land in the v1.5 LLM milestone per VIBEVM-SPEC §10.4; nothing to gate until then"

[[rust.exempt]]
unit = "vibe-wire"
reason = "generated code (JTD-schema codegen output), excluded by PROP-014 §2.3. That rule also designates the generator input under schemas/ as the taggable unit instead — designated, and untagged: measured 2026-08-05, none of the seven schemas carries a spec address and no scanner reads .json at all (B-060). The exemption stands on the generated-code half alone; do not read the second clause as a description of the tree"

[[rust.exempt]]
unit = "xtask"
reason = "internal developer tooling — panics are acceptable at the developer's own console; stays exempt on the record (CONVERT-PLAN Phase 5, 5.3)"

[[rust.exempt]]
unit = "vibe-test-support"
reason = "test-only support crate — consumed exclusively as a dev-dependency, ships in no binary; the Class-F/G seam and REQ-edge gates describe a product surface it does not have (DRIFT-020)"

[[rust.exempt]]
unit = "vibe-spec"
reason = "PROP-035 spec-compiler, provisional — not yet spec-tagged or REQ-edged; enters the gated list once the format stabilises and its seams are doctested (§15 migration puts vibevm's own adoption last)"
