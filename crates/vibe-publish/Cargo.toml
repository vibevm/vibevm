[package]
name = "vibe-publish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Maintainer-side package publishing — create per-package repos and push tagged releases"

[dependencies]
specmark.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
reqwest.workspace = true
semver.workspace = true
sha2.workspace = true
tempfile.workspace = true
walkdir.workspace = true
chrono.workspace = true
vibe-core.workspace = true
vibe-net.workspace = true
vibe-registry.workspace = true
# The index of a `monorepo` / `localdir` registry is projected by the
# index's own code (`vibe_index::layout`) and committed with the version it
# describes. `vibe-cli` already links the crate, so the binary gains nothing.
vibe-index.workspace = true
vibe-wire.workspace = true

[dev-dependencies]
rust-ai-native-env-audit.workspace = true
tempfile.workspace = true
walkdir.workspace = true
axum.workspace = true
tokio.workspace = true
