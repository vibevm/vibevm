[package]
name = "vibe-agent-projection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Agent-facing package-skill projection for vibevm — agent profiles, receipts, recovery and planning types below the MCP surface"

[dependencies]
specmark.workspace = true
vibe-core.workspace = true
vibe-workspace.workspace = true
# The shared capability-relative, no-follow project filesystem cell backing
# the receipt transaction machinery.
vibe-safefs.workspace = true
vibe-wire.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
dirs.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The staging-residue REDs need deterministic pre/post-publication failures;
# the feature compiles the injection points out of every shipped build.
vibe-safefs = { workspace = true, features = ["inject-failures"] }
