[package]
name = "vibe-spec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "spec:// addressing, the document IR, and the deterministic router (PROP-035)"

[features]
default = []
test-support = []

[dependencies]
specmark.workspace = true
thiserror.workspace = true
sha2.workspace = true
# The R4.2 emitted-XML test vehicle needs raw event spans. It cannot route
# through vibe-specdoc's pivot: the lane is a multi-root stream and every
# non-whitespace byte, including comments and lexical spelling, must survive.
quick-xml.workspace = true
# The spec-source dispatch (PROP-045 ##PROJECTION-READ): `FsSectionSource`
# reads a `.xml` dependency through `load_spec_text`'s canonical Markdown
# projection, so the fold/embed closure works unchanged over either form.
vibe-specdoc.workspace = true
# The R6 compiler-IR wire conversion (PROP-054 ##WHOLE-IR-WIRE): the generated
# strict JTD types, their JSON serializer, and the audited base64 codec for
# opaque emitted bytes. `vibe-spec` sits above `vibe-wire`; never the reverse.
vibe-wire.workspace = true
serde_json.workspace = true
# The strict byte reader's duplicate-key walker is a raw `DeserializeSeed`
# visitor over the JSON token stream (no derive, no Value). Already a locked
# workspace dependency of serde_json itself.
serde.workspace = true
base64.workspace = true
# The R4.1 transform-plan identity seam (PROP-054 `#TRANSFORM-PLAN-IDENTITY`):
# `vibe-spec` owns the typed plan, but its seed members are typed values that
# live below it — the registry kernel's compiled selector and provider
# metadata, `vibe-core`'s key/hash/group/name/kind scalars. The intended DAG
# is `vibe-spec -> vibe-extension-registry -> vibe-core` plus this direct
# `vibe-core` edge for typed-identity use; neither lower crate ever gains a
# reverse edge back up.
vibe-core.workspace = true
vibe-extension-registry.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The syntax-aware source fence parses the plan production cells as an AST
# (R4.1 round 1, C2): grouped/renamed imports, fully-qualified paths, type
# paths, macros and trait objects are classified structurally, so a string
# or comment containing a forbidden token can never hide real Rust from the
# fence. Dev-only — the runtime dependency set is unchanged.
syn.workspace = true
# The same fence parses this crate's manifest (and the two lower crates'
# manifests) structurally for the DAG proof instead of substring-scanning.
toml.workspace = true
