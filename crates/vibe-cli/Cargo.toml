[package]
name = "vibe-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The `vibe` CLI — entry point for vibevm"

[[bin]]
name = "vibe"
path = "src/main.rs"

[dependencies]
specmark.workspace = true
vibe-core.workspace = true
vibe-facts.workspace = true
vibe-actions.workspace = true
vibe-graph.workspace = true
vibe-install.workspace = true
vibe-lifecycle.workspace = true
# Project-only Claude/Codex/OpenCode skill projection belongs below MCP; the
# CLI consumes the lower kernel directly while MCP keeps compatibility exports.
vibe-agent-projection.workspace = true
# The create-phase agent backend: the CLI supplies `vibe-llm` behind the
# lifecycle's transport-neutral agent seam.
vibe-llm.workspace = true
vibe-registry.workspace = true
vibe-resolver.workspace = true
progress-core.workspace = true
vibe-check.workspace = true
# The PROP-045 projection dispatch (`load_spec_text`): every spec-text read
# in progress/show/tree routes XML sources through their canonical MD
# projection (##PROJECTION-READ).
vibe-specdoc.workspace = true
vibe-publish.workspace = true
vibe-workspace.workspace = true
vibe-mcp.workspace = true
vibe-orchestrator.workspace = true
vibe-settings.workspace = true
vibe-wire.workspace = true
vibe-spec.workspace = true
# `vibe explain` (the host traceability-explain command) is a thin surface
# over the shared `vibe-trace` capability, which both the CLI and the MCP
# `explain` tool call.
vibe-trace.workspace = true
# `vibe progress report`'s evidence column reads the committed traceability
# index through the engine's own wire model — one parser for specmap.json.
specmap-core.workspace = true
semver.workspace = true
anyhow.workspace = true
arboard.workspace = true
chrono.workspace = true
clap.workspace = true
console.workspace = true
dialoguer.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true
# `vibe tree` interactive TUI (PROP-036 §2.11).
rat-salsa.workspace = true
rat-widget.workspace = true
ratatui-core.workspace = true
ratatui-widgets.workspace = true
ratatui-crossterm.workspace = true
# `vibe tree -t` "no project here" native folder picker (VIBE-LAUNCHERS): when
# VibeTree is launched outside any project and none was opened before.
rfd = { version = "0.15", default-features = false }
# CDP attach to the running vibeterm Electron page (`vibe aiui inspect`) — PROP-042.
chromiumoxide.workspace = true
tokio.workspace = true
futures.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
# The lease-ordering red arms safefs' `before_lock` race hook to rewrite the
# selected manifest between `Project::open` and the OS lock — the inject
# surface exists only under this feature (R7.4 §10.4, authorised by root).
vibe-safefs = { workspace = true, features = ["inject-failures"] }
# Linking this isolates the test process's per-user settings home before the
# first `#[test]` runs, so a bare `cargo_bin` child cannot reach `~/.vibe`.
vibe-test-support.workspace = true
tempfile.workspace = true
rust-ai-native-env-audit.workspace = true
predicates.workspace = true
toml.workspace = true
vibe-core.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio.workspace = true
jsonschema.workspace = true
