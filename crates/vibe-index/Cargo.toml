[package]
name = "vibe-index"
version.workspace = true
edition = "2024"
rust-version = "1.93"
authors = ["Oleg Chirukhin"]
license-file.workspace = true
publish = false
description = "Package index utility for vibevm-shaped registries"
homepage = "https://gitverse.ru/vibevm/vibevm"
repository = "https://gitverse.ru/vibevm/vibevm"
keywords = ["vibevm", "package-index", "metadata", "spec-driven"]
categories = ["command-line-utilities", "development-tools"]
default-run = "vibe-index"

[lib]
name = "vibe_index"
path = "src/lib.rs"

[[bin]]
name = "vibe-index"
path = "src/main.rs"

[dependencies]
specmark.workspace = true
vibe-core = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["signal", "sync", "time", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# The catalog's `primary.jsonl.gz` is a PROJECTION: `repomd.json` records its
# size and sha256, and `rebuild --check` byte-compares it against a fresh fold
# of the journal. So its bytes must be a function of the journal alone — never
# of whoever links this crate. flate2 picks its DEFLATE backend by a cfg
# cascade (`any_c_zlib` > `zlib-rs` > `miniz_oxide`) over the features Cargo
# unified across the WHOLE build graph, and features only ever add: a consumer
# that also pulls `zip` (pinned workspace-wide to `deflate-flate2-zlib-rs`)
# silently switched this crate's encoder and moved the compressed bytes for
# identical input. Pinning one backend here removes the choice from the graph.
# `zlib-rs` is that backend: pure Rust, no C toolchain, and the codec the
# distribution surface already carries, so one implementation serves both.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# The library's types ARE the wire's types: `crate::types` re-exports the
# JTD-generated definitions this crate carries, so the edge is runtime, not
# test-only. The behaviour they used to carry on the hand-written side
# (`as_str`, `is_empty`, `minimal`, `finalise`, …) lives in
# `vibe_wire::behaviour` beside the form it describes.
vibe-wire = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
# Linking this isolates the test process's per-user settings home before the
# first `#[test]` runs, so a bare `cargo_bin` child cannot reach `~/.vibe`.
vibe-test-support = { workspace = true }
# The content-hash parity test cross-checks `vibe-index`'s and `vibe-registry`'s
# twin hashers byte-for-byte for each recipe (PROP-005 §3.2's promised parity
# gate). A dev-dependency never ships in the library (PROP-005 §3.2), so the
# standalone-redistribution rationale for the duplicated hasher still holds.
vibe-registry = { workspace = true }
