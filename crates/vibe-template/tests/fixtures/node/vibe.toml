[package]
name = "node"
group = "org.vibevm.node"
kind = "app"
version = "1.0.0"
epoch = 1
template = true
format = "normal"
authors = ["Oleg Chirukhin"]
license = "UPL-1.0"
description = "Node.js {version}, the official upstream build, as a portable Vibe application putting node, npm and npx on PATH"
keywords = ["node", "nodejs", "javascript", "runtime", "npm", "application"]
homepage = "https://nodejs.org/"

[compatibility]
min_vibe_version = "1.0.12"
requires_kinds = []

[application]
id = "node"
keywords = ["node", "nodejs", "npm", "javascript"]


[template.versions]
kind = "json"
url = "https://nodejs.org/dist/index.json"
select = ""
version_field = "version"
strip_prefix = "v"
min = "12.0.0"

[template.digests]
kind = "sha256sums"
url = "https://nodejs.org/dist/v{version}/SHASUMS256.txt"

[[template.channel]]
rule = "truthy"
name = "lts"
from = "lts"

[[template.channel]]
rule = "value"
prefix = "lts"
from = "lts"


[[installer_options]]
id = "linux-x64"
name = "Node.js {version}"
platform = "linux"
platform_name = "Linux (glibc)"
arch = "x86_64"
arch_name = "Intel/AMD 64-bit"
path_dirs = ["bin"]

[[installer_options.steps]]
id = "node"
title = "Download and unpack the Node.js {version} runtime"
kind = "archive"
format = "tar_gz"
source = "https://nodejs.org/dist/v{version}/node-v{version}-linux-x64.tar.gz"
sha256 = "{sha256:node-v{version}-linux-x64.tar.gz}"
payload_root = "node-v{version}-linux-x64"

[[installer_options.launchers]]
id = "node"
name = "node"
description = "The Node.js runtime"
executable = "bin/node"
kind = "command"
default = true

[[installer_options.launchers]]
id = "npm"
name = "npm"
description = "The npm package manager"
executable = "bin/node"
args = ["$app_root/lib/node_modules/npm/bin/npm-cli.js"]
kind = "command"

[[installer_options.launchers]]
id = "npx"
name = "npx"
description = "Run a command from an npm package"
executable = "bin/node"
args = ["$app_root/lib/node_modules/npm/bin/npx-cli.js"]
kind = "command"



