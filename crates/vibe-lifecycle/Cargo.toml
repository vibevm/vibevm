[package]
name = "vibe-lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Deterministic lifecycle phase model and request chaining for vibe"

[dependencies]
glob.workspace = true
getrandom.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
specmark.workspace = true
thiserror.workspace = true
toml.workspace = true
# The pure injected-home client-skill path helpers (§6.3.1.7): the three
# standalone-skill deploy providers call ONLY those, never the ambient
# directory resolvers the older compatibility APIs carry.
vibe-agent-projection.workspace = true
vibe-core.workspace = true
# The R4.0 registry kernel: this crate re-exports its public surface for
# compatibility (one transition, no flag day) and keeps only the
# execution-shaped plan and report metadata above it.
vibe-extension-registry.workspace = true
# `spec://` address grammar for `handler.prompt`. One parser owns the address
# form; the agent handler compares an already-parsed authority against the
# contributing provider rather than re-deriving the grammar.
vibe-spec.workspace = true
# Capability-relative, no-follow project mutation for declared agent outputs —
# the same cell package-skill receipts publish through.
vibe-safefs.workspace = true
vibe-wire.workspace = true
vibe-workspace.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The publish-stage REDs need a deterministic post-rename failure; the feature
# compiles the injection point out of every shipped build.
vibe-safefs = { workspace = true, features = ["inject-failures"] }
