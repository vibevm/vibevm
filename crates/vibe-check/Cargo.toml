[package]
name = "vibe-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Deterministic spec linter for vibevm projects (M1+)"

[dependencies]
specmark.workspace = true
semver.workspace = true
vibe-facts.workspace = true
# The PROP-045 projection dispatch: boot-directory validation reads XML
# boot files through the dialect (##LOADER-LAW, ##PROJECTION-READ).
vibe-specdoc.workspace = true
vibe-core.workspace = true
vibe-registry.workspace = true
vibe-resolver.workspace = true
# The documentation pipeline owns everything with content in it
# (PROP-057 `##PIPE-LIBRARY`), and the card's limits are content: the
# permitted formats, the proportions and the byte ceilings are declared
# there once and rendered here as linter findings. A second copy of a
# ceiling is a second law.
vibe-doc.workspace = true
anyhow.workspace = true
thiserror.workspace = true
walkdir.workspace = true
# One key lookup, not a second manifest grammar: a translation's
# `[i18n].canonical` must be WRITTEN, and the parsed manifest fills the
# default in (PROP-057 `##LOC-LANGUAGE-FIELD`).
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
