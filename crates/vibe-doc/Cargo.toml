[package]
name = "vibe-doc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
description = "The PROP-057 documentation pipeline: the example runner, the derived generators and the checks a documentation package answers to"

[dependencies]
specmark.workspace = true
thiserror.workspace = true
# The fixture declaration (`example.toml`) and the manifest a
# `manifest-field` reference addresses are both TOML read as data.
serde.workspace = true
toml.workspace = true
# `--json` example streams are parsed document by document and validated
# against the fixture's JTD schema map; the schemas themselves are JSON.
serde_json.workspace = true
# A normalisation rule is a DECLARED line form, visible in review
# (PROP-057 ##PIPE-EXAMPLE-RUNNER): a regular expression is the form the
# fixture spells it in.
regex.workspace = true
# Page discovery inside a documentation package.
walkdir.workspace = true
# The `derived` record keeps a hash of what each block last produced —
# never the text, which is the whole point of generating it.
sha2.workspace = true
# The pivot: pages are read through the documentation vocabulary, never
# by a second parser of our own (PROP-045 ##PIVOT-MODEL).
vibe-specdoc.workspace = true
# The `audience` vocabulary the pivot's `<status>` carries. Its single
# home is PROP-043 and its single implementation is this crate's
# `Audience`, so the manifest maps that enum rather than re-reading the
# attribute with a second opinion about what the values mean.
progress-core.workspace = true
# A `rule` citation is a `spec://` address. The grammar and the
# «doc-path → file» lookup (with its PROP-NNN prefix inversion) have ONE
# home — `vibe-spec` — and a second reading of either would be a second
# law (PROP-035 §6).
vibe-spec.workspace = true
# The layout laws a citation source resolves against — the spec root, the
# materialisation root — and the canonical language default a cited spec
# carries when its manifest declares none (PROP-052, PROP-003 §2.7).
vibe-core.workspace = true
# The machine store's entry layout (PROP-010 §2.7): documentation warmed
# with `vibe cache add` cites specs that live there and nowhere else.
vibe-registry.workspace = true
# The lock file's materialisation slot (PROP-057 ##LOCAL-WARMUP names
# `slot_abs_path` as one of this library's four sources).
vibe-workspace.workspace = true
# A store or slot directory is named by its version, and «the freshest
# one present» is a semver question.
semver.workspace = true
# The page manifest is a wire contract, so its type is generated from
# `schemas/doc_manifest.jtd.json` and never hand-written (PROP-000 §16,
# PROP-044). This library builds that generated type directly.
vibe-wire.workspace = true

[dev-dependencies]
tempfile.workspace = true
