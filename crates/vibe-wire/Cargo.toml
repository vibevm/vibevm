[package]
name = "vibe-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Generated Rust types for vibevm wire contracts (JTD-driven, see PROP-000 §16)"

[dependencies]
# The `x-rust-type` annotations name domain types verbatim (P23), so the
# generated aliases bind against them: `vibe_core::Group`,
# `semver::Version`, `chrono::DateTime<chrono::Utc>`.
chrono.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
# The compile trace index's canonical snapshot filename collapses an
# overlong name to `~` + 16 hex of the SHA-256 of its encoded middle
# (R3.4 refresh ruling 3); the validator recomputes that digest rather
# than trusting the shape.
sha2.workspace = true
vibe-core.workspace = true

[dev-dependencies]
# The `format_id_completeness` test parses the format registry.
toml.workspace = true
