[package]
name = "vibe-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Workspace discovery and the multi-package member model for vibevm"

[dependencies]
specmark.workspace = true
# The PROP-045 projection dispatch: an XML-materialised boot snippet enters
# the static splice as its canonical MD projection (##BOOT-LANE-SCOPE,
# ##PROJECTION-READ), and authored discovery accepts both serialisations.
vibe-specdoc.workspace = true
thiserror.workspace = true
glob.workspace = true
semver.workspace = true
sha2.workspace = true
serde.workspace = true
# The compile-trace index is JTD-owned metadata, so the run writer serialises
# and reads the GENERATED type rather than growing a hand-written encoder.
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
vibe-core.workspace = true
vibe-facts.workspace = true
# Capability-relative, no-follow publication: the trace writer publishes
# snapshots create-new and replaces its index atomically through the one
# containment law rather than a second copy of it.
vibe-safefs.workspace = true
vibe-spec.workspace = true
vibe-wire.workspace = true

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW and O_NONBLOCK are the platform constants std's safe
# OpenOptionsExt requires for race-safe opens without unsafe code.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# Safe wrappers around by-handle metadata keep identity and hardlink checks
# compatible with the workspace's `forbid(unsafe_code)` contract.
winapi-util.workspace = true

[dev-dependencies]
proptest.workspace = true
vibe-spec = { workspace = true, features = ["test-support"] }
# The two publication faults the trace REDs inject are compiled out of every
# shipped build; the tests turn them on for this crate's own test profile.
vibe-safefs = { workspace = true, features = ["inject-failures"] }
