[package]
name = "vibe-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Model Context Protocol server for vibevm — exposes installed packages and subskills to coding agents over stdio JSON-RPC"

[dependencies]
specmark.workspace = true
vibe-core.workspace = true
vibe-workspace.workspace = true
# The shared capability-relative, no-follow project filesystem cell.
vibe-safefs.workspace = true
vibe-wire.workspace = true
# The `explain` MCP tool is a thin surface over the shared `vibe-trace`
# capability, which both the MCP tool and the `vibe explain` CLI call.
vibe-trace.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
dirs.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tempfile.workspace = true

[dev-dependencies]
# The staging-residue REDs need deterministic pre/post-publication failures;
# the feature compiles the injection points out of every shipped build.
vibe-safefs = { workspace = true, features = ["inject-failures"] }
