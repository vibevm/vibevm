[package]
name = "vibe-trace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Host traceability-explain capability — build the specmap fresh in memory and render a target's subgraph"

[dependencies]
specmark.workspace = true
specmap-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# `vibe-core` for the package manifest (`vibe.toml` → `[package]` group/name) so
# the foreign resolver can map an installed `vibedeps/` slot to its globally-
# unique coordinate `<group>/<name>` — the same identity the `vibe specmap`
# generator mints the carried map under. `semver` picks the highest-version slot
# when more than one is materialised, so resolution is deterministic regardless
# of directory iteration order.
vibe-core.workspace = true
semver.workspace = true
# The ONE provider seam this crate implements (R7.5 A3): the trait and
# its request/outcome types live in the query library; wire
# current/carried/provenance stay derived THERE, never chosen here.
vibe-requirements.workspace = true
# The generated `RequirementRelation` the seam's edges carry.
vibe-wire.workspace = true
# Capability-relative, no-follow one-file read for the carried map:
# single-link identity + final-name recheck without a full slot walk.
vibe-safefs.workspace = true
# The carried-map trust ladder reads the slot record and the shared
# file hasher (`vibedeps::read_slot_record` / `sha256_file`) — the
# lock-selected slot's durable identity and footprint.
vibe-workspace.workspace = true

[dev-dependencies]
tempfile.workspace = true
