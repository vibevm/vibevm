[package]
name = "vibe-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core types, manifest schemas, and graph model for vibevm"

[dependencies]
libc.workspace = true
specmark.workspace = true
# Shared structural artifact-need vocabulary, not rollup or scheduler authority.
progress-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
# The remap acceptance ledger and provider map of PROP-066 `#consent` /
# `#providers` are `.json` documents of one home, read and written here.
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
semver.workspace = true
indexmap.workspace = true
sha2.workspace = true
tracing.workspace = true
url.workspace = true
# Git's view of a package source compares names the way the repository's
# `core.ignorecase` / `core.precomposeunicode` say Git and the filesystem
# do: NFC composition and full case folding (PROP-024 `#SHIPPABLE-TREE-DEF`).
icu_normalizer.workspace = true
unicode-casefold.workspace = true
# Only for the `git-fixture` feature's isolated test `git`.
tempfile = { workspace = true, optional = true }

[features]
# The hermetic `git` fixture (`git_source::fixture`) for other crates' tests.
git-fixture = ["dep:tempfile"]

[dev-dependencies]
tempfile.workspace = true
