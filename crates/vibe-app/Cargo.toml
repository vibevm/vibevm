rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "User applications (PROP-059): package resolution, installer options, storage libraries, the index, installation and launch; the CLI and the PATH proxy are thin callers"

[dependencies]
chrono.workspace = true
flate2.workspace = true
glob.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
specmark.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
vibe-core.workspace = true
vibe-net.workspace = true
vibe-install.workspace = true
vibe-package-source.workspace = true
vibe-registry.workspace = true
vibe-safefs.workspace = true
vibe-wire.workspace = true
zip.workspace = true

# A slot's link directory is a directory junction on Windows
# (`PROP-059#path-directories`): no standard API creates one, so it is written
# with `FSCTL_SET_REPARSE_POINT`. A Windows symbolic link would need
# `SeCreateSymbolicLinkPrivilege`, which an ordinary user on a managed machine
# does not have; a junction needs no privilege.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
