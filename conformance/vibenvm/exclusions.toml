# conformance/vibenvm/exclusions.toml — the accepted-gap set, and nothing else.
#
# Authority: PROP-075 `#VIBENVM-EXCLUSIONS` (the row format) and
# `#VIBENVM-EXCLUSIONS-APPROVED` (the owner's decision of 2026-11-10: fourteen
# proposed, twelve approved, two rejected). `coverage.py` reads this file and
# nothing else does. A row without `approved_by = "owner"` and a date does not
# count as approved and the gate fails on it, so a worker cannot widen the set;
# and the set is closed — `coverage.py` holds the closure of the owner's twelve
# approved items and fails on any row that is not one of them.
#
# The two rows the design proposed and the owner REJECTED are deliberately
# absent: `nvm install --skip-default-packages` and `$NVM_DIR/default-packages`
# are a general feature (`#SLOT-EXTRAS`), so the suite covers them with real
# differential cases instead.
#
# Row rules, from `#VIBENVM-EXCLUSIONS-APPROVED`:
#   1. the gate's unit is an extracted `(subcommand, flag)` pair, so an
#      approved item naming two flags is two rows sharing one reason —
#      `install -s` and `install -b` are two, which is why twelve approved
#      items are fourteen rows here;
#   2. `subcommand = "*"` means every verb on which the extraction finds that
#      flag, which is what `--only=` needs;
#   3. an item the extraction does not yield as a pair at all — an environment
#      variable or an internal file — is recorded with `subcommand =
#      "(environment)"` or `"(internal)"` and is reported as recorded, not
#      required, so no row can silently satisfy a pair nvm never yielded.
#
# `flag` is spelled as `nvm.sh` spells it, without the `=` and without a
# value: `--lts=*` and `--lts` are one flag, `--lts` (`inventory.json`
# carries the same rule as `flag_spelling`). `item` names which of the
# owner's twelve approved items the row belongs to.
schema = 1

# ---- named user aliases (five approved items) --------------------------
# Deferred by `#VERSIONS-OPEN`, and the owner's reason is a survey: named user
# aliases are built in to only 5 of the 17 version switchers surveyed, 6 reach
# them only by a plugin or a workaround and 6 have none at all, so they are not
# a must-have — while the one alias everyone really uses, `default`, is the slot
# default vibe already has, and `lts` / `latest` / `stable` are channels.

[[exclusion]]
item = "named user aliases: nvm alias"
subcommand = "alias"
flag = ""
reason = "Named user aliases are deferred by #VERSIONS-OPEN; the built-ins map already — `default` is the slot default, `node`/`stable` are channels, `system` is the slot off-switch — and if they are ever built it is as one general feature for every application, not an nvm patch."
approved_by = "owner"
approved = "2026-11-10"

[[exclusion]]
item = "named user aliases: nvm unalias"
subcommand = "unalias"
flag = ""
reason = "The same deferral: there is no named user alias to delete until that one general feature exists."
approved_by = "owner"
approved = "2026-11-10"

[[exclusion]]
item = "named user aliases: nvm install --alias="
subcommand = "install"
flag = "--alias"
reason = "Naming an alias after installing is the same deferred feature; the one alias that matters in practice is `--default`, which maps to `vibe app use`."
approved_by = "owner"
approved = "2026-11-10"

[[exclusion]]
item = "named user aliases: nvm ls --no-alias"
subcommand = "ls"
flag = "--no-alias"
reason = "Suppressing alias output has nothing to suppress while named user aliases are deferred."
approved_by = "owner"
approved = "2026-11-10"

[[exclusion]]
item = "named user aliases: $NVM_DIR/alias/*"
subcommand = "(internal)"
flag = "$NVM_DIR/alias/*"
reason = "nvm's own alias store is the deferred feature's storage; recorded so the accepted-gap set is complete, and reported as recorded rather than required because the extraction yields no pair for it."
approved_by = "owner"
approved = "2026-11-10"

# ---- source build (two approved items, three rows) ---------------------

[[exclusion]]
item = "source build: nvm install -s / -b"
subcommand = "install"
flag = "-s"
reason = "vibe selects an installer option, never a build mode, and the Node template publishes only upstream's prebuilt archives, so `-s` has nothing to apply to; the feature that would close it is filed as B-253 and deliberately not done."
approved_by = "owner"
approved = "2026-11-10"

[[exclusion]]
item = "source build: nvm install -s / -b"
subcommand = "install"
flag = "-b"
reason = "The same decision seen from the other side: binary-only is always true of the Node template, so `-b` is a no-op rather than a choice (B-253)."
approved_by = "owner"
approved = "2026-11-10"

[[exclusion]]
item = "source build: nvm install -j <N>"
subcommand = "install"
flag = "-j"
reason = "A source-build knob: with no source installer option there is nothing to parallelise (B-253, which records declared parallelism as part of that option)."
approved_by = "owner"
approved = "2026-11-10"

# ---- version categories and nvm-internal state (two approved items) ----

[[exclusion]]
item = "version categories: nvm install --only=<categories>"
subcommand = "*"
flag = "--only"
reason = "nvm's four categories are an nvm-internal taxonomy — `lts` is a channel, `alpha` is `prerelease = \"include\"` on the template, `iojs` is a dead product and `non-lts` serves no scenario — so a general version-class concept in vibe would be weight carried for one dead product; `subcommand = \"*\"` because the pinned v0.41.0 carries this flag on nearly every verb and twenty rows with one reason would hide rather than show the decision."
approved_by = "owner"
approved = "2026-11-10"

[[exclusion]]
item = "nvm-internal state: $NVM_ONLY, .lts-status, install locks, $NVM_AUTH_HEADER, third-party hook"
subcommand = "(environment)"
flag = "$NVM_ONLY, $NVM_AUTH_HEADER"
reason = "nvm's own category selection and download authorisation; vibe has its own authorisation (PROP-066 #locator) and no category concept, so there is nothing to compare."
approved_by = "owner"
approved = "2026-11-10"

[[exclusion]]
item = "nvm-internal state: $NVM_ONLY, .lts-status, install locks, $NVM_AUTH_HEADER, third-party hook"
subcommand = "(internal)"
flag = ".lts-status, per-version install locks, third-party installer hook"
reason = "nvm's own install machinery, against which vibe has its own locks and its own installation law (PROP-065); recorded, not required."
approved_by = "owner"
approved = "2026-11-10"

# ---- prefix hygiene, colours and diagnostics (three approved items) ----

[[exclusion]]
item = "hygiene: nvm use --delete-prefix"
subcommand = "use"
flag = "--delete-prefix"
reason = "`$PREFIX` / `$NPM_CONFIG_PREFIX` is nvm's conflict with itself; vibe owns its own install root and its own PATH, so there is no prefix to delete."
approved_by = "owner"
approved = "2026-11-10"

[[exclusion]]
item = "hygiene: nvm set-colors"
subcommand = "set-colors"
flag = ""
reason = "The colour decision is PROP-060 #DISPLAY's, taken once for every command; a per-tool palette would break that one decision."
approved_by = "owner"
approved = "2026-11-10"

[[exclusion]]
item = "hygiene: nvm debug"
subcommand = "debug"
flag = ""
reason = "vibe's diagnostic is `vibe self doctor`; nvm's dump enumerates nvm's own internals, against which there is nothing to compare."
approved_by = "owner"
approved = "2026-11-10"
