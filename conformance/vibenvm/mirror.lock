# conformance/vibenvm/mirror.lock — the suite's pin, and the digest of every
# file `fetch-mirror.sh` downloads (PROP-075 `#VIBENVM-PIN`, `#VIBENVM-SUITE`).
#
# Tab-separated rows. The pin rows are authored by hand from the spec; the
# `sha256` rows are written by `fetch-mirror.sh --lock` and verified on every
# run — `run.sh` exits 3 on a mismatch, so a tampered mirror cannot pass as a
# conformance result.
#
# The two index files are the pinned set's records filtered out of upstream's
# `index.json` / `index.tab`; see fetch-mirror.sh for why they are filtered
# (a mirror describes what the mirror has, and the digest then depends on the
# pinned set alone rather than on Node's release cadence).
#
# The node set is small on purpose, and it is the spec's own shape: two
# versions in one major (v22.9.0 non-LTS, v22.11.0 the Jod LTS line), one
# older major (v20.18.0, the Iron LTS line) and one newer non-LTS
# (v23.1.0, so `node` / `latest` resolves to something the mirror holds).
