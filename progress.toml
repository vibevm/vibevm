# Progress Control scope (PROP-043 §4) — wave 1 of the spec-actualization
# campaign: the host `spec/` tree only. `packages/` waves come later;
# widen this include list when the owner opens wave 2.
#
# The generated boot artifacts `spec/boot/STATIC.md` + `spec/boot/INDEX.md`
# are OUT of scope (owner ruling 2026-07-24, campaign plan LOG): they are
# rewritten by `vibe install`, so markup written into them dies on regen.
# `spec/WAL.md` is OUT for the same reason in session form (owner ruling
# 2026-07-24, second): the checkpoint is rewritten wholesale every
# session-end — markup cannot live in it. The authored boot snippets
# (00-core, 90-user) are NOT generated (user-owned; vibe never writes
# them) and stay observed via `spec/boot/[0-9]*.md`.
# The legacy dirs (terraforms, research, neworder, discipline) left the
# spec tree for root `legacy-spec/` in Phase L (relocated 2026-07-25,
# per the owner rulings of the same day): long-executed refactoring
# plans, research studies, and the superseded Discipline copy —
# historical records, not living contracts; the campaign does not mark
# or verify them. The one carve-out is the active campaign plan, which
# stays at `spec/terraforms/SPEC-ACTUALIZATION-CAMPAIGN-v0.1.md`
# (owner ruling: the §6 monthly recurrence consumes it in place).
# Re-add a glob here if an archived doc is ever promoted back to
# living-contract status.
# §4 is include-only by design, so exclusions are expressed by
# enumeration; a new spec/ subtree or top-level spec doc must be added
# here explicitly — review at batch boundaries.
# WAVE 2 opened 2026-07-26 (PACKAGES-ACTUALIZATION-CAMPAIGN ratified): the two
# authored package namespaces join the scope. The host's 58 files STAY in
# scope — wave 2 does not un-measure wave 1, and both corpora share one
# `progress check` gate that must stay at 0.
# Out of scope and deliberately so: `packages/org.vibevm.fractality/**` (its
# own specspace, its own boot contract and WAL) and `vibedeps/**` (regenerated
# consumer copies of the same packages — marking a copy is marking nothing).
#
# AUDITED 2026-07-26 on an owner challenge ("did you really keep everything
# generated out?"). Result across all 344 observed files: exactly two top-level
# roots (`packages`, `spec`), and NO path segment named target, vibedeps,
# node_modules, vendor, .vibe, refs, campaigns, fixtures, dist, build,
# generated or .git — `DEFAULT_EXCLUDES` (scope.rs) holds those always-on,
# even under an explicit include. Two leaks the exclusion list does NOT catch,
# both filed and both needing the same code-side fix:
#   F-071 — `spec/cards/INDEX.md` in all three language stacks is a DERIVED
#           index ("hand edits are a defect", its own words). Markup there
#           dies on regen. Wave 1 dodged the same problem for its boot
#           artifacts via the `spec/boot/[0-9]*.md` glob; `packages/**/*.md`
#           has no equivalent trick and §4 is include-only by design.
#   F-070 — 33 `LICENSE.md` files, 264 paragraphs of verbatim UPL text.
# Until both land, `check --exhaustive` cannot go green honestly.
#
# NOTE, and it bites immediately: with two `campaigns/<id>/` zones present, a
# BARE `vibe progress …` no longer resolves a campaign — `resolve_campaign`
# returns the single zone only when exactly one exists, and otherwise drops to
# ad-hoc mode, where reports work and STATE IS SILENTLY NOT WRITTEN. Always
# pass `--campaign campaigns/packages-2026-09` (or the wave-1 zone) from here on.
schema = 1
include = [
    "spec/boot/[0-9]*.md",
    "spec/common/**/*.md",
    "spec/design/**/*.md",
    "spec/manual-tests/**/*.md",
    "spec/modules/**/*.md",
    "packages/org.vibevm.world/**/*.md",
    "packages/org.vibevm.ai-native/**/*.md",
]
