# Progress Control scope (PROP-043 §4) — wave 1 of the spec-actualization
# campaign: the host `spec/` tree only. `packages/` waves come later;
# widen this include list when the owner opens wave 2.
#
# The generated boot artifacts `spec/boot/STATIC.md` + `spec/boot/INDEX.md`
# are OUT of scope (owner ruling 2026-07-24, campaign plan LOG): they are
# rewritten by `vibe install`, so markup written into them dies on regen.
# §4 is include-only by design, so the exclusion is expressed by
# enumeration; `spec/boot/[0-9]*.md` admits the authored snippets
# (00-core, 90-user) and skips the generated pair. A new spec/ subtree
# must be added here explicitly — review at batch boundaries.
schema = 1
include = [
    "spec/*.md",
    "spec/boot/[0-9]*.md",
    "spec/common/**/*.md",
    "spec/design/**/*.md",
    "spec/discipline/**/*.md",
    "spec/manual-tests/**/*.md",
    "spec/modules/**/*.md",
    "spec/neworder/**/*.md",
    "spec/research/**/*.md",
    "spec/terraforms/**/*.md",
]
