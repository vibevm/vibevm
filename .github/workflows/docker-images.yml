name: Build and publish vibevm container images

on:
  workflow_dispatch:
    inputs:
      npm_registry:
        description: npm registry used while building the documentation image
        required: false
        default: "https://registry.npmjs.org"
        type: string
  workflow_run:
    workflows: ["Build vibevm distributions"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: vibevm-container-images-1.0.10
  cancel-in-progress: false

jobs:
  images:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve exact mutable-release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/vibevm/vibevm/releases/download/v1.0.10/DISTRIBUTIONS.json \
            --output "$RUNNER_TEMP/vibevm-distributions.json"
          vibe_sha="$(jq -er '.platforms[] | select(.target == "x86_64-unknown-linux-musl") | .bootstrap.digest | sub("^sha256:"; "")' "$RUNNER_TEMP/vibevm-distributions.json")"
          vibe_commit="$(jq -er '.source_commit' "$RUNNER_TEMP/vibevm-distributions.json")"
          vibe_tag="$(git ls-remote https://github.com/vibevm/vibevm.git refs/tags/v1.0.10 | awk '{print $1}')"
          test "$vibe_commit" = "$vibe_tag"
          curl --fail --location --retry 3 \
            https://github.com/vibevm/vibevm/releases/download/v1.0.10/vibe-bootstrap-x86_64-unknown-linux-musl \
            --output docker/vibevm/vibe-bootstrap
          echo "$vibe_sha  docker/vibevm/vibe-bootstrap" | sha256sum -c -
          echo "vibe_sha=$vibe_sha" >> "$GITHUB_OUTPUT"

      - name: Remember the currently tagged image generations
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          for image in vibevm vibevm-dev vibevm-doc; do
            key="${image//-/_}"
            digest="$(docker buildx imagetools inspect "vibevm/$image:1.0.10" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
            echo "$key=$digest" >> "$GITHUB_OUTPUT"
          done

      # `vibevm/vibevm-zap` is not built here: its Zap source is a private
      # repository this workflow cannot read anonymously. Build it by hand
      # from `docker/vibevm-zap/Dockerfile` with access to that repository.
      - name: Build all three images locally
        env:
          NPM_REGISTRY: ${{ inputs.npm_registry || vars.NPM_CONFIG_REGISTRY || 'https://registry.npmjs.org' }}
          VIBE_SHA: ${{ steps.release.outputs.vibe_sha }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg VIBE_SHA256="$VIBE_SHA" \
            -t vibevm/vibevm:1.0.10 -t vibevm/vibevm:latest \
            -f docker/vibevm/Dockerfile docker/vibevm
          docker build \
            --build-arg BASE_IMAGE=vibevm/vibevm:1.0.10 \
            --build-arg NPM_CONFIG_REGISTRY="$NPM_REGISTRY" \
            -t vibevm/vibevm-dev:1.0.10 -t vibevm/vibevm-dev:latest \
            -f docker/vibevm-dev/Dockerfile docker/vibevm-dev
          docker build \
            --build-arg BASE_IMAGE=vibevm/vibevm:1.0.10 \
            --build-arg DEV_IMAGE=vibevm/vibevm-dev:1.0.10 \
            --build-arg NPM_CONFIG_REGISTRY="$NPM_REGISTRY" \
            --build-arg UMAMI_WEBSITE_ID="$UMAMI_WEBSITE_ID" \
            -t vibevm/vibevm-doc:1.0.10 -t vibevm/vibevm-doc:latest \
            -f docker/vibevm-doc/Dockerfile .

      - name: Smoke the unpublished images
        env:
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm vibevm/vibevm:1.0.10 vibe --version)" = "vibe 1.0.10"
          docker run --rm vibevm/vibevm:1.0.10 git --version
          docker run --rm vibevm/vibevm-dev:1.0.10 sh -lc 'rustc --version && node --version && pnpm --version && vibe --version'
          docker run -d --name doc-smoke -p 127.0.0.1:18081:80 vibevm/vibevm-doc:1.0.10
          trap 'docker rm -f doc-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do curl --fail --silent http://127.0.0.1:18081/ >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:18081/ >/dev/null
          curl --fail --silent http://127.0.0.1:18081/doc/ >/dev/null
          curl --fail --silent http://127.0.0.1:18081/doc/org.vibevm.core/vibevm-docs/latest/ >/dev/null
          if [ -n "$UMAMI_WEBSITE_ID" ]; then
            # Capture the page before matching: `curl | grep -q` fails under
            # pipefail when grep stops reading early (curl exits 23).
            for path in / /doc/org.vibevm.core/vibevm-docs/latest/; do
              body="$(curl --fail --silent "http://127.0.0.1:18081$path")"
              grep -q "data-website-id=\"$UMAMI_WEBSITE_ID\"" <<<"$body"
            done
          fi

      - name: Authenticate to Docker Hub
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username vibevm --password-stdin

      - name: Publish the mutable release tag and latest
        shell: bash
        run: |
          set -euo pipefail
          for image in vibevm vibevm-dev vibevm-doc; do
            docker push "vibevm/$image:1.0.10"
            docker push "vibevm/$image:latest"
          done

      - name: Delete superseded untagged manifests
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          OLD_VIBEVM: ${{ steps.previous.outputs.vibevm }}
          OLD_VIBEVM_DEV: ${{ steps.previous.outputs.vibevm_dev }}
          OLD_VIBEVM_DOC: ${{ steps.previous.outputs.vibevm_doc }}
        run: |
          set -euo pipefail
          for row in \
            "vibevm:$OLD_VIBEVM" \
            "vibevm-dev:$OLD_VIBEVM_DEV" \
            "vibevm-doc:$OLD_VIBEVM_DOC"; do
            image="${row%%:*}"
            old_digest="${row#*:}"
            test -n "$old_digest" || continue
            new_digest="$(docker buildx imagetools inspect "vibevm/$image:1.0.10" | awk '$1 == "Digest:" { print $2; exit }')"
            test "$old_digest" != "$new_digest" || continue
            if curl --fail --silent "https://hub.docker.com/v2/repositories/vibevm/$image/tags?page_size=100" \
              | jq -e --arg digest "$old_digest" '.results | any(.digest == $digest)' >/dev/null; then
              echo "retain $image@$old_digest: another tag still references it"
              continue
            fi
            token="$(curl --fail --silent --user "vibevm:$DOCKERHUB_TOKEN" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:vibevm/$image:pull,push,delete" \
              | jq -er '.token')"
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request DELETE --header "Authorization: Bearer $token" \
              "https://registry-1.docker.io/v2/vibevm/$image/manifests/$old_digest")"
            test "$status" = 202 || test "$status" = 404
          done
