name: Build vibevm distributions

on:
  workflow_dispatch:
    inputs:
      version:
        description: Mutable product version to prepare and finalize
        required: true
        type: string
        default: "1.0.9"
      upload:
        description: Replace the version's GitHub draft, upload all five bundles, and publish it
        required: true
        type: boolean
        default: false
      checks:
        description: Forward --checks to every native build
        required: true
        type: boolean
        default: false
      tests:
        description: Forward --tests to every native build (off by default)
        required: true
        type: boolean
        default: false
      self_check:
        description: Forward --self-check to every native build
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vibevm-distribution-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare one mutable-version draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the selected revision
        if: ${{ inputs.upload }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain
        if: ${{ inputs.upload }}
        run: rustup show active-toolchain

      - name: Build the release orchestrator without credentials
        if: ${{ inputs.upload }}
        run: cargo build --locked --package xtask

      - name: Prepare or replace the mutable-version draft
        if: ${{ inputs.upload }}
        env:
          VIBEVM_DIST_VERSION: ${{ inputs.version }}
          VIBEVM_PUBLISH_TOKEN_GITHUB: ${{ secrets.GITHUB_TOKEN }}
          CARGO_MANIFEST_DIR: ${{ github.workspace }}/xtask
        run: target/debug/xtask dist prepare --version "$VIBEVM_DIST_VERSION"

      - name: Build-only run needs no GitHub draft
        if: ${{ inputs.upload == false }}
        run: echo "upload=false; native jobs will build without touching GitHub Releases."

  build:
    name: ${{ matrix.label }}
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            script: distribution/release/build-windows-x86_64.ps1
          - label: Linux x86_64 musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            script: distribution/release/build-linux-x86_64.sh
          - label: Linux x86_64 GNU
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            script: distribution/release/build-linux-x86_64-gnu.sh
          - label: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            script: distribution/release/build-macos-x86_64.sh
          - label: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            script: distribution/release/build-macos-aarch64.sh
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain and native target
        shell: bash
        run: |
          set -eu
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"

      - name: Install the Linux static-linker toolchain
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Provision the pinned JTD generator for the full gate
        if: ${{ inputs.self_check }}
        shell: bash
        run: |
          set -eu
          tool="$RUNNER_TEMP/jtd-codegen"
          mkdir -p "$tool"
          if [ '${{ runner.os }}' = macOS ] && [ '${{ runner.arch }}' = ARM64 ]; then
            cargo install --git https://github.com/jsontypedef/json-typedef-codegen \
              --tag v0.4.1 --locked --root "$tool" --bin jtd-codegen jtd_codegen_cli
            tool="$tool/bin"
          else
            case '${{ runner.os }}' in
              Windows) platform=x86_64-pc-windows-gnu ;;
              macOS) platform=x86_64-apple-darwin ;;
              Linux) platform=x86_64-unknown-linux-gnu ;;
              *) exit 1 ;;
            esac
            curl --fail --location --retry 3 \
              "https://github.com/jsontypedef/json-typedef-codegen/releases/download/v0.4.1/$platform.zip" \
              --output "$tool/tool.zip"
            python -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$tool/tool.zip" "$tool"
            if [ '${{ runner.os }}' != Windows ]; then chmod +x "$tool/jtd-codegen"; fi
          fi
          echo "$tool" >> "$GITHUB_PATH"

      - name: Prepare a native case-sensitive macOS scratch volume
        if: ${{ runner.os == 'macOS' && inputs.self_check }}
        shell: bash
        run: |
          set -eu
          image="$RUNNER_TEMP/vibevm-gate.sparseimage"
          mount="$RUNNER_TEMP/vibevm-gate"
          hdiutil create -size 16g -type SPARSE -fs 'Case-sensitive APFS' -volname vibevm-gate "$image"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -mountpoint "$mount" "$image"
          mkdir -p "$mount/tmp"
          # /var is a system symlink on macOS. The no-follow fixtures need the
          # physical spelling, and case-alias controls need distinct files.
          python3 -c 'import os, sys; print("TMPDIR=" + os.path.realpath(sys.argv[1]))' "$mount/tmp" >> "$GITHUB_ENV"

      - name: Prepare physical Windows scratch and native MSVC tools
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP 'vvm'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          $scratch = & python -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' $scratch
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the physical Windows scratch directory.' }
          "TEMP=$scratch" >> $env:GITHUB_ENV
          "TMP=$scratch" >> $env:GITHUB_ENV

          $cargoTool = & rustup which cargo
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate the selected native Cargo toolchain.' }
          $env:PATH = (Split-Path -Parent $cargoTool) + ';' + $env:PATH

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'The native MSVC x64 build tools are unavailable.' }
          $developerCommand = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $developerEnvironment = & $env:ComSpec /d /c "call `"$developerCommand`" -no_logo -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize the native MSVC environment.' }
          # Import only compiler/search-path variables; never print the full environment.
          foreach ($entry in $developerEnvironment) {
            $pair = $entry -split '=', 2
            if ($pair.Count -eq 2 -and $pair[0] -in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir')) {
              Set-Item -LiteralPath "Env:$($pair[0])" -Value $pair[1]
              "$($pair[0])=$($pair[1])" >> $env:GITHUB_ENV
            }
          }
          $msvcBin = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64'
          $linker = Join-Path $msvcBin 'link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) { throw 'The native MSVC x64 linker is unavailable.' }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
          # Git Bash otherwise places GNU link.exe ahead of MSVC. Preserve the
          # native linker on PATH even in callback environments that filter Cargo variables.
          $bashEnvironment = Join-Path $env:RUNNER_TEMP 'vvm-msvc.bash'
          $bashBin = $msvcBin.Replace("'", "'\''")
          $bashSetup = 'export PATH="$(cygpath -u ''' + $bashBin + '''):$PATH"' + "`n"
          [IO.File]::WriteAllText($bashEnvironment, $bashSetup, [Text.UTF8Encoding]::new($false))
          "BASH_ENV=$($bashEnvironment.Replace('\', '/'))" >> $env:GITHUB_ENV

      - name: Build the Windows bundle
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          VIBEVM_DIST_VERSION: ${{ inputs.version }}
        run: |
          $options = @()
          if ('${{ inputs.checks }}' -eq 'true') { $options += '--checks' }
          if ('${{ inputs.tests }}' -eq 'true') { $options += '--tests' }
          if ('${{ inputs.self_check }}' -eq 'true') { $options += '--self-check' }
          & ./${{ matrix.script }} @options

      - name: Build the POSIX bundle
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          VIBEVM_DIST_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          set --
          if [ '${{ inputs.checks }}' = true ]; then set -- "$@" --checks; fi
          if [ '${{ inputs.tests }}' = true ]; then set -- "$@" --tests; fi
          if [ '${{ inputs.self_check }}' = true ]; then set -- "$@" --self-check; fi
          sh '${{ matrix.script }}' "$@"

      - name: Smoke Intel macOS portable-flow materialization
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        shell: bash
        run: |
          set -eu
          project="$(mktemp -d)"
          settings="$(mktemp -d)"
          vibe="$GITHUB_WORKSPACE/dist/vibe-bootstrap-x86_64-apple-darwin"
          chmod 0755 "$vibe"
          VIBE_SETTINGS="$settings" "$vibe" init --path "$project" --no-registry --no-progress
          VIBE_SETTINGS="$settings" "$vibe" install flow:wal \
            --path "$project" \
            --registry "$GITHUB_WORKSPACE/vibevm/vibepacks" \
            --assume-yes \
            --no-progress
          VIBE_SETTINGS="$settings" "$vibe" tree --path "$project" --plain \
            | grep -F 'org.vibevm.world/wal'

      - name: Retain the native bundle as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vibevm-${{ matrix.target }}
          path: |
            dist/vibevm-*
            dist/vibe-bootstrap-*
          if-no-files-found: error

      - name: Detach the owned macOS scratch volume
        if: ${{ always() && runner.os == 'macOS' && inputs.self_check }}
        shell: bash
        run: |
          mount="$RUNNER_TEMP/vibevm-gate"
          if mount | grep -F " on $mount ("; then hdiutil detach "$mount"; fi

  upload:
    name: Upload ${{ matrix.target }} from retained build output
    if: ${{ inputs.upload }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the release orchestrator without credentials
        run: cargo build --locked --package xtask

      - name: Restore the exact native build output
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vibevm-${{ matrix.target }}
          path: dist

      - name: Upload only from the prebuilt orchestrator
        env:
          VIBEVM_DIST_VERSION: ${{ inputs.version }}
          VIBEVM_PUBLISH_TOKEN_GITHUB: ${{ secrets.GITHUB_TOKEN }}
          CARGO_MANIFEST_DIR: ${{ github.workspace }}/xtask
        run: target/debug/xtask dist upload-built --target "${{ matrix.target }}"

  finalize:
    name: Verify five bundles and finalize the release
    if: ${{ always() && inputs.upload && needs.prepare.result == 'success' && needs.upload.result == 'success' }}
    needs:
      - prepare
      - upload
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain

      - name: Build the release orchestrator without credentials
        run: cargo build --locked --package xtask

      - name: Finalize only the complete five-target draft
        env:
          VIBEVM_DIST_VERSION: ${{ inputs.version }}
          VIBEVM_PUBLISH_TOKEN_GITHUB: ${{ secrets.GITHUB_TOKEN }}
          CARGO_MANIFEST_DIR: ${{ github.workspace }}/xtask
        run: target/debug/xtask dist finalize --version "$VIBEVM_DIST_VERSION" --publish
