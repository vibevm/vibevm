[project]
name = "vibevm"
group = "org.vibevm.core"
version = "1.0.12"
# PROP-045: материализация спек зависимостей — XML (слово владельца 2026-08-22,
# догфуд сценария №0: исходники MD, слоты XML).
spec_format = "xml"
authors = ["Oleg Chirukhin"]

[requires.packages]
"flow:org.vibevm.world/omnichannel" = "^1.0.13"
"flow:org.vibevm.world/working-rules" = "^1.0.13"
"org.vibevm.doc/web" = "^1.0.13"
"stack:org.vibevm.ai-native/rust-ai-native" = "^1.0.13"
"stack:org.vibevm.ai-native/typescript-ai-native" = "^1.0.13"

[requires.packages."flow:org.vibevm.world/multi-user-planning"]
version = "^1.0.13"
link = "static-transitive"

[requires.packages."org.vibevm.world/redbook"]
version = "^1.0.13"
link = "static-transitive"
exclude = [
  "org.vibevm.world/wal",
  "org.vibevm.world/wal-specspaces",
]

# vibevm is its own bootstrap project — the tool itself, and now the first
# consumer of packages it authors: flow:multi-user-planning above resolves from
# the local vibevm/vibepacks/ tree. The `[[registry]]` blocks below
# configure remote registry resolution for this project.
#
# Two registries by default: `vibespecs` on GitHub and `vibespecs-gitverse`
# on GitVerse. `vibe registry publish` drives the create-repo + push-tag flow
# on both (`--registry vibespecs-gitverse` for GitVerse); git, monorepo and
# localdir registries publish by plain push or copy. Resolution asks
# `vibespecs` first and falls through to `vibespecs-gitverse`.
#
# Every vibevm-owned package follows the vibevm version from 1.0.12 on, so
# the requirements above ask for at least 1.0.12.
[[registry]]
name = "vibespecs"
url = "https://github.com/vibespecs"

[[registry]]
name = "vibespecs-gitverse"
url = "https://gitverse.ru/vibespecs"
naming = "name"

# redbook@1 is immutable and its dormant wal-specspaces member fragment names
# the WAL concept. This consumer deliberately excludes that whole continuity
# family in favour of multi-user-planning, so silence only that known legacy
# concept warning at the root; no package bytes or edition roster are rewritten.
[visibility]
ignore-concept-warnings = ["WAL"]

# Explicit host command: it first takes the ordinary incremental build path,
# then serves the complete host-owned site. This is deliberately a typed
# script handler rather than an npm-style shell string.
[[command]]
id = "vibevm-doc"
description = "Incrementally build and serve the complete VibeVM site"
handler = { kind = "script", base = "vibevm/vibepacks/org.vibevm.doc/web/v1.0.13/tooling/site-build/serve" }

# The repository owns the domain and every package whose documentation it
# publishes, so its ordinary build lifecycle owns their composition too. This
# host contribution asks the web package's adapter to render the complete
# local catalogue; the adapter itself remains a package-owned implementation.
[[extension]]
id = "build-documentation-site"
point = "phase:build"
handler = { kind = "script", base = "vibevm/vibepacks/org.vibevm.doc/web/v1.0.13/tooling/site-build/build" }
inputs = [
  "vibe.toml",
  "VIBEVM-SPEC.md",
  "vibevm/vibespecs/**",
  "vibevm/vibepacks/**/vibe.toml",
  "vibevm/vibepacks/**/README.md",
  "vibevm/vibepacks/**/vibevm/vibespecs/**",
  "vibevm/vibepacks/org.vibevm.doc/web/v1.0.13/package.json",
  "vibevm/vibepacks/org.vibevm.doc/web/v1.0.13/pnpm-lock.yaml",
  "vibevm/vibepacks/org.vibevm.doc/web/v1.0.13/pnpm-workspace.yaml",
  "vibevm/vibepacks/org.vibevm.doc/web/v1.0.13/design/**",
  "vibevm/vibepacks/org.vibevm.doc/web/v1.0.13/site/package.json",
  "vibevm/vibepacks/org.vibevm.doc/web/v1.0.13/site/adapters/**",
  "vibevm/vibepacks/org.vibevm.doc/web/v1.0.13/site/src/**",
  "vibevm/vibepacks/org.vibevm.doc/web/v1.0.13/site/vite.config.ts",
  "vibevm/vibepacks/org.vibevm.doc/web/v1.0.13/tools/**",
  "vibevm/vibepacks/org.vibevm.doc/web/v1.0.13/tooling/site-build/**",
]
