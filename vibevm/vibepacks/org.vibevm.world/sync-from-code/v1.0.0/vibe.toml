[package]
name = "sync-from-code"
group = "org.vibevm.world"
kind = "flow"
version = "1.0.0"
epoch = 1
authors = ["Oleg Chirukhin"]
license = "UPL-1.0"
description = "Sync-from-Code protocol: reconcile specs with code when the code changed first"
keywords = ["sync", "reconciliation", "spec-drift", "discipline"]

[compatibility]
