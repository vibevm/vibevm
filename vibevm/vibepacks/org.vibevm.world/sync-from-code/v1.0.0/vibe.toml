requires_kinds = []

[boot_snippet]
source = "vibevm/vibespecs/boot/20-flow-sync-from-code.xml"

category = "flow"

[[boot_snippet.fragment]]
source = "vibevm/vibespecs/boot/20a-wal-binding.xml"
when = "installed:org.vibevm.world/wal"

