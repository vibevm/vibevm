[package]
name = "redbook"
group = "org.vibevm.world"
kind = "flow"
version = "1.1.0"
epoch = 1
format = "normal"
authors = ["Oleg Chirukhin"]
license = "UPL-1.0"
description = "The redbook collection: the AI-native development practices, distilled from the book into installable flows — one edition, one tested set"
keywords = ["collection", "practices", "ai-native", "spec-driven", "book"]

[compatibility]
min_vibe_version = "0.1.0"
requires_kinds = []

[boot_snippet]
source = "vibevm/vibespecs/boot/03-flow-redbook.xml"


category = "flow"

# Current mutable next cohort 1.1.0 (D-019), following historical edition 1.0.
# Members remain exactly pinned; routine composition changes do not bump it.
# PROP-003#M05F1-REDBOOK: continuity is package-local explicit choice.

[[boot_snippet.fragment]]
source = "vibevm/vibespecs/boot/03a-member-wal.xml"
when = "installed:org.vibevm.world/wal"

[[boot_snippet.fragment]]
source = "vibevm/vibespecs/boot/03b-member-wal-specspaces.xml"
when = "installed:org.vibevm.world/wal-specspaces"

[requires.packages]
# The book's core (edition 0.1.0)
"flow:org.vibevm.world/two-process-model" = "=1.1.0"
"flow:org.vibevm.world/sync-from-code" = "=1.1.0"
"flow:org.vibevm.world/git-practices" = "=1.1.0"
"flow:org.vibevm.world/addressable-specs" = "=1.1.0"
"flow:org.vibevm.world/decision-records" = "=1.1.0"
"flow:org.vibevm.world/conflict-protocol" = "=1.1.0"
"flow:org.vibevm.world/campaign-plans" = "=1.1.0"
"flow:org.vibevm.world/discovery-prompt" = "=1.1.0"
# attribution-policy now arrives via git-practices (§12.1 human-authored)
# The project-practice wave (edition 0.2.0)
"flow:org.vibevm.world/operating-modes" = "=1.1.0"
"flow:org.vibevm.world/health-audit" = "=1.1.0"
"flow:org.vibevm.world/manual-tests" = "=1.1.0"
"flow:org.vibevm.world/secrets-hygiene" = "=1.1.0"
"flow:org.vibevm.world/licensing" = "=1.1.0"
"flow:org.vibevm.world/source-mirrors" = "=1.1.0"
"flow:org.vibevm.world/spec-genres" = "=1.1.0"
"flow:org.vibevm.world/comparative-research" = "=1.1.0"
"flow:org.vibevm.world/managed-blocks" = "=1.1.0"
"flow:org.vibevm.world/qualified-naming" = "=1.1.0"
"flow:org.vibevm.world/tool-design-lessons" = "=1.1.0"
# The cultural-extraction wave (first accumulated after edition 0.2.0; now
# part of the 1.0.0 tested set).
# The owner 2026-08-02 F-114 mandatory roster-bump rule is historical and superseded.
# Next composition uses mutable 1.1.0; routine updates require no bump or renewed version question.
# Governing law: spec://org.vibevm.core/vibevm/common/PROP-000#REDBOOK-COMPOSITION-POLICY; public distribution remains held by NEXT-PUBLICATION-HOLD.
"flow:org.vibevm.world/dev-runtime-docs" = "=1.1.0"
"flow:org.vibevm.world/wal-specspaces" = "=1.1.0"
"flow:org.vibevm.world/wal" = "=1.1.0"
"flow:org.vibevm.world/multi-user-planning" = "=1.1.0"

# Optionality belongs to declarations; effects reference those same IDs and
# preserve their exact version/source/visibility metadata.
[features]
profile = "constrained-r1"
optional = [
  "org.vibevm.world/multi-user-planning",
  "org.vibevm.world/wal",
  "org.vibevm.world/wal-specspaces",
  "org.vibevm.world/health-audit",
  "org.vibevm.world/manual-tests",
  "org.vibevm.world/comparative-research",
  "org.vibevm.world/dev-runtime-docs",
  "org.vibevm.world/discovery-prompt",
]

[features.effects]
mup = [{ dependency = "org.vibevm.world/multi-user-planning" }]
wal = [{ dependency = "org.vibevm.world/wal" }]
health-audit = [{ dependency = "org.vibevm.world/health-audit" }]
manual-tests = [{ dependency = "org.vibevm.world/manual-tests" }]
comparative-research = [{ dependency = "org.vibevm.world/comparative-research" }]
dev-runtime-docs = [{ dependency = "org.vibevm.world/dev-runtime-docs" }]
discovery-prompt = [{ dependency = "org.vibevm.world/discovery-prompt" }]
wal-specspaces = [{ dependency = "org.vibevm.world/wal-specspaces" }]

[features.groups.continuity]
cardinality = "exactly-one"
members = ["mup", "wal"]
defaults = ["mup"]

[features.groups.additions]
cardinality = "zero-or-more"
members = ["health-audit", "manual-tests", "comparative-research", "dev-runtime-docs"]

[features.groups.mup-additions]
cardinality = "zero-or-more"
members = ["discovery-prompt"]
guards = [{ member = "mup" }]

[features.groups.wal-additions]
cardinality = "zero-or-more"
members = ["wal-specspaces"]
guards = [{ member = "wal" }]
