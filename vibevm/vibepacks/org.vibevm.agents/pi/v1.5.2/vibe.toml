[package]
name = "pi"
group = "org.vibevm.agents"
kind = "app"
version = "1.5.2"
[application]
id = "pi"
[[installer_options]]
id = "linux-x64-standalone"
name = "Official Pi standalone Linux x64"
platform = "linux"
platform_name = "Linux"
arch = "x86_64"
[installer_options.installation]
type = "tar_gz"
source = "https://github.com/earendil-works/pi/releases/download/v1.5.2/pi-linux-x64.tar.gz"
sha256 = "811c6f2c9e7aaee252b5404252e556fb713aa209c1f7f924226aa77d4ef70cb5"
payload_root = "pi"
[[installer_options.launchers]]
id = "main"
name = "Pi"
executable = "$app_root/pi"
kind = "command"
default = true
[[installer_options.public_commands]]
name = "pi"
launcher = "main"
