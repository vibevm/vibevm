[package]
name = "pi"
group = "org.vibevm.agents"
kind = "app"
version = "1.5.2"
[application]
id = "pi"
[[installer_options]]
id = "linux-x64-standalone"
name = "Official Pi standalone Linux x64"
platform = "linux"
platform_name = "Linux"
arch = "x86_64"
[installer_options.installation]
type = "tar_gz"
source = "https://github.com/earendil-works/pi/releases/download/v1.5.2/pi-linux-x64.tar.gz"
sha256 = "811c6f2c9e7aaee252b5404252e556fb713aa209c1f7f924226aa77d4ef70cb5"
payload_root = "pi"
[[installer_options.launchers]]
id = "main"
name = "Pi"
executable = "$app_root/pi"
kind = "command"
default = true
[[installer_options.public_commands]]
name = "pi"
launcher = "main"

[[installer_options]]
id = "macos-arm64-standalone"
name = "Official Pi standalone macOS arm64"
platform = "macos"
platform_name = "macOS"
arch = "aarch64"
[installer_options.installation]
type = "tar_gz"
source = "https://github.com/earendil-works/pi/releases/download/v1.5.2/pi-darwin-arm64.tar.gz"
sha256 = "56b5e194d485ced555667b8ba3276157a8272e9ecde9e001e428af80985bdd9b"
payload_root = "pi"
[[installer_options.launchers]]
id = "main"
name = "Pi"
executable = "$app_root/pi"
kind = "command"
default = true
[[installer_options.public_commands]]
name = "pi"
launcher = "main"

[[installer_options]]
id = "windows-x64-standalone"
name = "Official Pi Windows x64 CLI"
platform = "windows"
platform_name = "Windows"
arch = "x86_64"
[installer_options.installation]
type = "zip"
source = "https://github.com/earendil-works/pi/releases/download/v1.5.2/pi-windows-x64.zip"
sha256 = "e6adb8cb8c84eca14391ad24b363de9d2be98a89ca3ba3fdee1fa4de32b7f2e8"
[[installer_options.launchers]]
id = "main"
name = "Pi"
executable = "$app_root/pi.exe"
kind = "command"
default = true
[[installer_options.public_commands]]
name = "pi"
launcher = "main"
