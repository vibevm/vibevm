[package]
name = "codex"
group = "org.vibevm.agents"
kind = "app"
version = "0.171.0"
[application]
id = "codex"

[[installer_options]]
id = "linux-x64-musl"
name = "Official codex Linux x64 CLI"
platform = "linux"
platform_name = "Linux"
arch = "x86_64"
[installer_options.installation]
type = "tar_gz"
source = "https://github.com/openai/codex/releases/download/rust-v0.171.0/codex-x86_64-unknown-linux-musl.tar.gz"
sha256 = "01baa2e47809f8597be5b2f8abd4e4dfe3fb5bcb6e504c2fbaaad97056c15e8d"
[[installer_options.launchers]]
id = "main"
name = "codex"
executable = "$app_root/codex-x86_64-unknown-linux-musl"
kind = "command"
default = true
[[installer_options.public_commands]]
name = "codex"
launcher = "main"

