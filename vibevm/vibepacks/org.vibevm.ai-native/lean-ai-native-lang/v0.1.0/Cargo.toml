[workspace]
resolver = "3"
members = ["crates/lean-ai-native-check", "crates/lean-ai-native-cli", "crates/vendor/core-ai-native-specmap", "crates/vendor/core-ai-native-specmark", "crates/vendor/core-ai-native-specmark-grammar"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["Oleg Chirukhin"]
license-file = "LICENSE.md"
publish = false
repository = "https://gitverse.ru/vibevm/vibevm"
homepage = "https://gitverse.ru/vibevm/vibevm"

[workspace.dependencies]
lean-ai-native-check = { path = "crates/lean-ai-native-check" }
specmap-core = { package = "core-ai-native-specmap", path = "crates/vendor/core-ai-native-specmap" }
specmark = { package = "core-ai-native-specmark", path = "crates/vendor/core-ai-native-specmark" }
specmark-grammar = { package = "core-ai-native-specmark-grammar", path = "crates/vendor/core-ai-native-specmark-grammar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
tempfile = "3"
anyhow = "1"
quick-xml = "0.41.0"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
