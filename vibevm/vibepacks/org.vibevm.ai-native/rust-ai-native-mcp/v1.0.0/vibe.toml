[package]
name = "rust-ai-native-mcp"
group = "org.vibevm.ai-native"
kind = "mcp"
version = "1.0.0"
epoch = 1
format = "normal"
authors = ["Oleg Chirukhin"]
license = "UPL-1.0"
description = "The AI-Native Rust discipline over MCP: every rust-ai-native command and the tcg type oracle as agent tools, served straight from the slot with no vibe in the runtime path"
keywords = ["mcp", "rust", "ai-native", "discipline", "agent"]

[compatibility]
min_vibe_version = "0.1.0"
requires_kinds = []

# The exact-pin law (PROP-027 §2.3): this package vendors the stack's
# toolchain crates byte-identically (sync-engines), and the pin holds
# the vendored engines and the consumer's installed gates to ONE
# resolved version set. Bumped in lockstep with the stack, always.
[requires]
packages = { "lang:org.vibevm.ai-native/rust-ai-native-lang" = "=1.0.0" }

[[binary]]
name = "rust-ai-native-mcp"
crate = "crates/rust-ai-native-mcp"
description = "the stdio MCP server: 18 tools - the discipline command surface + the tcg type oracle"

[[mcp_server]]
name = "rust-ai-native"
binary = "rust-ai-native-mcp"
description = "AI-Native Rust discipline gates + type oracle over MCP (PROP-027)"
args = ["--path", "{project_root}"]

# The second half of `B-188` (PROP-065 `#ordinary-consumer`): the MCP server
# above is of no use until an agent knows about it, and the install named
# `vibe mcp install` nowhere. It is `optional = true` because it writes into
# the user's own agent configuration rather than into this package's slot — a
# failure is recorded and the installation carries on.
[[extension]]
id = "register-mcp"
point = "slot:post-install"
title = "Register the MCP server with your agents (vibe mcp install)"
handler = { kind = "script", base = "tooling/post-install/register-mcp" }
optional = true
