# The learning path: the order a newcomer reads the manual in, chapter by
# chapter, with the reference pages last (PROP-057 ##NAV-CHAPTERS). It moves
# no other order: `pages` in the page manifest and the llms files keep the
# layer law. Every page stands in exactly one chapter; `vibe check` holds that.
[[navigation.chapter]]
id = "getting-started"
title = "Getting started"
pages = ["start/what-vibevm-is", "start/index", "start/install-vibe", "start/first-project", "start/what-a-project-contains"]

