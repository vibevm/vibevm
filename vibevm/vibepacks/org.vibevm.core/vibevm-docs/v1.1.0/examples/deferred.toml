# Examples whose golden is not captured from a debug build of the product,
# with the event that will capture each one (X-026, PROP-057
# ##PIPE-EXAMPLE-RUNNER).
#
# The list exists so that an uncaptured example is DECLARED rather than
# left on a page as an empty `<expect></expect>` — which the dialect reads
# as «this command prints nothing», an assertion nobody made. A declared
# skip says what is missing and what will supply it; an empty golden says
# something false.
