# Русская адаптация руководства VibeVM — отдельный пакет вида `doc`, который
# зеркалит источник блок в блок (spec://org.vibevm.core/vibevm/common/PROP-057#LOC-MIRROR):
# те же пути, те же якоря, те же примеры по ссылке. Предложения — свои.
# Как и остальные пакеты в дереве, это подвижный слот одной версии: текст
# движется, номер стоит, машинный store обновляется по хэшу.
[package]
name = "vibevm-docs-ru"
group = "org.vibevm.core"
kind = "doc"
version = "1.0.0"
epoch = 1
format = "normal"
authors = ["Oleg Chirukhin"]
license = "UPL-1.0"
description = "Руководство VibeVM по-русски: установить vibe, понять пакеты и стартовую полосу, работать с агентом, писать и публиковать пакеты."
keywords = ["документация", "руководство", "vibevm", "пакеты", "агенты", "жизненный цикл"]
title = "Руководство VibeVM"
# Чьей рукой написана проза этих страниц — для читателя, который хочет знать
# (spec://org.vibevm.core/vibevm/common/PROP-057#CARD-AUTHORSHIP). Это
# утверждение о тексте, а не о коммитах: авторство репозитория задаёт
# PROP-000 `##commits`, и оно от этого поля не меняется.
authorship = "ai"
abstract = """
Что покрывает: что такое VibeVM и как он даёт агенту-кодеру нужный текст для чтения; установку vibe; создание проекта; пакеты, реестры, лок-файл и машинный store; установку, обновление, публикацию и работу без сети; навык vibevm для агента и работу через него; жизненный цикл от проверки до выкладки; полный справочник команд, манифеста, лок-файла и настроек; написание пакетов всех видов, включая документацию и её адаптации.
Для кого: для тех, кто запускает vibe в своих проектах, для тех, кто пишет пакеты, и для агентов, которые читают за них.
Что считает известным: как пользоваться терминалом и текстовым редактором, что такое агент-кодер и что делает менеджер пакетов для языка программирования.
Чего не покрывает: сами нормативные спецификации (руководство их цитирует, а не пересказывает), внутреннее устройство отдельных агентов и историю проектирования vibe.
"""

[compatibility]
min_vibe_version = "1.0.0"
requires_kinds = []

[i18n]
canonical = "ru"

# Предмет документации — тот же, что у источника: сам хост, координата проекта
# (spec://org.vibevm.core/vibevm/common/PROP-057#LOC-DOCUMENTS-MATCH).
[[documents]]
package = "org.vibevm.core/vibevm"
version = "^1.0"

# Источник: английское руководство. Официальность адаптации — та же группа и имя
# `<docname>-<lang>` (spec://org.vibevm.core/vibevm/common/PROP-057#LOC-OFFICIAL-TRANSLATION).
[translates]
package = "org.vibevm.core/vibevm-docs"
version = "^1.0"

# Где страницы стоят в навигации
# (spec://org.vibevm.core/vibevm/common/PROP-057#NAV-PINNED). Пути те же, что
# у источника — адаптация зеркалит дерево страниц; названия разделов свои,
# на языке этого пакета.
[navigation]
pinned = ["start/what-vibevm-is", "start/index"]

