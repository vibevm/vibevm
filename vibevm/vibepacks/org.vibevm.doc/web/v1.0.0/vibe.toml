# The site of VibeVM as a package of kind `app`
# (spec://org.vibevm.core/vibevm/common/PROP-057#kinds): one Qwik
# application that carries both the landing and the documentation, built
# and deployed on its own and installed into nobody's project. Like the
# other in-tree packages it is a mutable development slot of one version:
# the content moves, the number stays.
[package]
name = "web"
group = "org.vibevm.doc"
kind = "app"
version = "1.0.0"
epoch = 1
format = "normal"
authors = ["Oleg Chirukhin"]
license = "UPL-1.0"
description = "The vibevm.org site: the landing and the documentation reader, one Qwik application in two adapters."
keywords = ["site", "documentation", "qwik", "typescript", "design-system"]
title = "VibeVM Site"
abstract = """
What it covers: the whole of vibevm.org — the landing at `/` and `/ru/`, the documentation reader under `/doc/`, the design system both are drawn with, and the two adapters that build them (a static site for the server, an embedded shell for `vibe doc serve`).
For whom: the people who build and deploy the site, and the agents that change a component or a route on their behalf.
What it assumes known: TypeScript, a component framework, and the shape of a static build; the documentation pipeline that renders the HTML islands this application displays is described by its own package.
What it leaves out: the text of the documentation, which lives in the `doc` packages this site renders; the rendering of a page into an island, which belongs to the Rust pipeline; and the server the build is deployed to.
"""

[compatibility]
min_vibe_version = "1.0.0"
requires_kinds = []

[application]
id = "vibevm-doc"

# Every platform installs the same way: one recipe step with no sources, so
# the package tree itself is the input (VIBE_PACKAGE); the recipe copies it
# without build output and writes a relocatable `bin/vibevm-doc` wrapper
# (spec://org.vibevm.core/vibevm/common/PROP-059#source-build).
[[installer_options]]
id = "linux-x64"
name = "Local site launcher"
platform = "linux"
platform_name = "Linux"
arch = "x86_64"
arch_name = "Intel/AMD 64-bit"

[[installer_options.steps]]
id = "install"
title = "Copy the site tree and write the relocatable launcher"
kind = "recipe"
interpreter = "posix_sh"
script = "tooling/local-site/install.sh"

[[installer_options.launchers]]
id = "vibevm-doc"
name = "vibevm.org local site"
description = "Serves the site on http://127.0.0.1:4322/"
executable = "bin/vibevm-doc"
terminal = true
default = true

[[installer_options.public_commands]]
name = "vibevm-doc"
launcher = "vibevm-doc"

