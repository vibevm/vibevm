# The TypeScript discipline the package is authored under: the seven-step
# floor, the structural gate and the traceability map all come from this
# family (spec://org.vibevm.core/vibevm/common/PROP-057#STACK-FLOOR).
[requires]
packages = { "stack:org.vibevm.ai-native/typescript-ai-native" = "^1.0" }
