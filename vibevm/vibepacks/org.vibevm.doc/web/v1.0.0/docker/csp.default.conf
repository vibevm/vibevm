# The policy of a container that has not been handed a render yet.
#
# It defines the variable and answers with nothing, so nginx starts and
# serves — an empty value adds no header at all. The real one comes from
# the render itself (`.vibe-site/csp.conf`, written by the site build
# from the hashes it computed over the pages it wrote), and the
# entrypoint puts it here before nginx reads its configuration.
#
# The variable has to exist even when there is no policy: nginx refuses
# to start on an unknown variable, and a domain that would not come up
# because a render had not happened yet is a worse failure than a page
# served without a policy for one restart.
map $sent_http_content_type $vibe_csp {
    default "";
}
