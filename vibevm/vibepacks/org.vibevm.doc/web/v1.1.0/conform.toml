# conform.toml — this project's AI-Native discipline policy
# (ENGINE-CONFORM; generated by `typescript-ai-native init`, then owned by you).
#
# The [typescript] table drives the ts-tsc structural gate
# (`typescript-ai-native-conform`): the §8 unsafe-set ban, cell isolation over
# import specifiers, and the file-length budget. Cells start EXEMPT and
# flip into `gated` one by one, each after its findings drain to zero
# (expand-as-you-conform — a flip must never widen a baseline). Rust-side
# keys stay at their defaults until Rust code joins the tree.

max_file_lines = 600

[typescript]
# Two roots because the package is one pnpm workspace of two parts
# (spec://org.vibevm.core/vibevm/common/PROP-057#STACK-WORKSPACE): the
# design system and the application that consumes it. Everything outside
# them — the build drivers under `tools/`, the APCA audit under
# `design/audit/` — is plain Node scripting that never ships to a browser.
roots = ["design/src", "site/src"]
# `site/src/fixtures/` holds bytes copied from the Rust pipeline's goldens
# (an island, a page manifest). They are inputs to be compared against,
# never code to be judged. `site/src/generated/` is emitted by
# `cargo xtask codegen` from the wire schema and diffed against the
# generator's output: judging its shape would be judging the generator's.
exclude_substrings = ["/fixtures/", "/generated/"]
gated = []
# No `cells_dir`: the cell layout addresses a domain split into isolated
# units with one seam each, and this package's units are a component
# library and a route tree — the framework already fixes their boundaries.
seam = "index"
