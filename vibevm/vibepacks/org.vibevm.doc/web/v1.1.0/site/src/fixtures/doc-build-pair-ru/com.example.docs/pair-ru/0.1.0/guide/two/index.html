  <h1 id="root">Вторая</h1>
  <p data-p="1" data-fact="LEAD-TWO" data-status="doc/work"><a class="p-anchor" id="p01" href="#p01">01</a>Вторая страница пары, у которой средний блок — список.</p>
  <p data-p="2"><a class="p-anchor" id="p02" href="#p02">02</a>Первый пункт. Второй пункт.</p>
  <p data-p="3" data-fact="TAIL-TWO" data-status="doc/work"><a class="p-anchor" id="p03" href="#p03">03</a>И закрывающий абзац после него.</p>
