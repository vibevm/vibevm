# The whole domain, served out of one directory.
#
# This is the serving half of the two-container deployment
# (PROP-057 `##SITE-TWO-CONTAINERS`, `##SITE-CONTAINER-NGINX`): stock
# nginx, this file, and a directory the renderer filled — the landing at
# `/` and `/ru/`, the documentation under `/doc/`, and the machine files
# of the domain root beside them. Nothing here knows how many packages
# the site carries; it serves a directory.
#
# It inherits the landing's `nginx.conf` — `charset` with its
# `charset_types`, `expires -1` for HTML, the immutable cache, the `/en/`
# redirect, the security headers, `error_page 404` and `try_files` — and
# changes five things, each with its reason where it stands:
#
#   1. the immutable cache names `/assets/`, `/build/` and `/fonts/`
#      rather than `/_astro/`, which is Astro's directory and is not
#      written by this build at all (X-040);
#   2. `absolute_redirect off; port_in_redirect off;` is written down
#      rather than assumed, so every redirect this container issues is
#      relative (`##SEO-CHARSET-AND-REDIRECTS`);
#   3. three addresses are refused: the builder's own directory, the
#      optimizer's manifest and the policy file (`##STACK-BUILD-HYGIENE`);
#   4. the Content-Security-Policy the build computed is served on HTML
#      and only on HTML, out of a file the build wrote (X-035, X-044);
#   5. `.md` is given a media type, because nginx has none for it and a
#      page's Markdown projection would otherwise be sent as a download.
#
# What is deliberately NOT here: TLS, certificates, ports of the host,
# the proxy in front of this container and anything else outside the
# site's own services. They are the owner's and this file never mentions
# them (R-24). The container listens on 80 inside its own network
# namespace; because every redirect it writes is relative, whatever
# terminates TLS in front of it keeps its own scheme, host and port.

# The policy of the render currently on disk.
#
# It is a `map` and not an `add_header` on the server, because the policy
# names one hash per distinct inline script — 47 on the fixture library,
# about 150 on the manual — and a header of that size on every asset of
# every page would be paid for by readers a hundred times per page for
# nothing: only a document can execute a script (X-044). The map answers
# with the empty string for every other media type, and nginx adds no
# header at all for an empty value.
#
# The file is written by the site build from the hashes it computed over
# the bytes it wrote, and the image ships an empty one so that a
# container started before the first render still starts. Nobody types a
# hash into a configuration file (X-035).
include /etc/nginx/csp.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # The domain is decided by whatever routes traffic to this container,
    # not by the container: one site, one directory, any name.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every redirect relative. TLS terminates outside this container, so
    # nginx cannot know the scheme or the port a reader arrived on, and a
    # `Location` it guessed a plaintext scheme for would send a strict
    # fetcher into a redirect loop (`##SEO-CHARSET-AND-REDIRECTS`).
    absolute_redirect off;
    port_in_redirect off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/markdown application/json
               application/javascript text/xml application/xml
               application/rss+xml application/atom+xml text/javascript
               image/svg+xml;

    # Always declare UTF-8 for text formats. Without this some crawlers
    # decode UTF-8 bytes as Latin-1 and choke on em-dashes and Cyrillic.
    # It affects every machine file of the domain root, both sitemaps,
    # the feed, the JSON manifests, and the Markdown and XML projection
    # of every documentation page.
    charset utf-8;
    charset_types
        text/plain
        text/css
        text/markdown
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # HTML and every other unversioned file revalidates on each request;
    # the content-addressed directories below override it.
    expires -1;

    # Security headers, and the policy for documents.
    #
    # They are repeated in the locations that set a header of their own,
    # and that repetition is not an oversight: `add_header` in a location
    # REPLACES the inherited set rather than adding to it, so a location
    # that names one header and no others silently drops the rest.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $vibe_csp always;

    # ─── What the domain does not publish ────────────────────────────
    #
    # The builder keeps its state and the rendered documentation trees
    # inside the output directory, because the question that state
    # answers is «what is in THIS directory» and an answer kept
    # elsewhere goes stale the first time a directory is copied. The
    # price of that decision is one rule here.
    location ^~ /.vibe-site {
        return 404;
    }

    # The optimizer's manifest is build metadata no page fetches. The
    # build removes it; this answers the address anyway, because a
    # hygiene step that is only enforced in one of two places is
    # enforced in neither (`##STACK-BUILD-HYGIENE`).
    location ~ /q-manifest\.json$ {
        return 404;
    }

    # The policy, as a file. It is served as a header on every page and
    # has no second life as a download.
    location = /csp.txt {
        return 404;
    }

    # ─── Redirects ───────────────────────────────────────────────────
    #
    # English is served at the root. The legacy `/en/` prefix of the
    # Astro landing keeps answering, and the static build writes a real
    # page there for anyone who reaches it without this container.
    location = /en/ { return 301 /; }
    location = /en  { return 301 /; }

    # The documentation lives under a directory, and the directory's
    # address ends in a slash: a reader who types the short form is sent
    # to the canonical one rather than served a page whose relative
    # links would all resolve one level too high.
    location = /doc { return 301 /doc/; }

    # Stable bootstrap endpoints. Release assets stay canonical on
    # GitHub; these short addresses are what the landing's own install
    # commands say out loud, so they are part of the domain's contract
    # and not a convenience.
    location = /install.sh {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 302 https://github.com/vibevm/vibevm/releases/latest/download/install.sh;
    }
    location = /install.ps1 {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 302 https://github.com/vibevm/vibevm/releases/latest/download/install.ps1;
    }

    # ─── Long-lived immutable assets ─────────────────────────────────
    #
    # Three directories and no more. Everything in them is named by a
    # hash of its own content — the bundler's chunks in `/build/`, the
    # faces and data files it emitted in `/assets/`, and the public
    # copies of the fonts in `/fonts/`, which the pages preload by a
    # stable address — so a changed file is a changed address and a year
    # is safe.
    #
    # `/og.png` and `/favicon.svg` are deliberately NOT here, and that is
    # the change from the landing's rule: they are written fresh by every
    # build under an unchanging address, and a year of immutable caching
    # would pin a stale social card on every share for that year.
    location ~ ^/(assets|build|fonts)/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ─── The Markdown projection of every page ───────────────────────
    #
    # nginx ships no media type for `.md`, so without this the projection
    # beside every documentation page would be sent as
    # `application/octet-stream` — a download, unreadable in a browser,
    # and outside `charset_types`, which is what the charset requirement
    # is actually about for this format (`##SEO-RAW-PROJECTIONS`).
    location ~ \.md$ {
        default_type text/markdown;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ─── Everything else ─────────────────────────────────────────────
    #
    # The landing at the root and under `/ru/`, every documentation
    # address under `/doc/`, and the machine files of the domain root:
    # `robots.txt`, `llms.txt`, `llms-full.txt`, `sitemap.xml`,
    # `feed.xml`, the IndexNow key file, the social card, the icon.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
