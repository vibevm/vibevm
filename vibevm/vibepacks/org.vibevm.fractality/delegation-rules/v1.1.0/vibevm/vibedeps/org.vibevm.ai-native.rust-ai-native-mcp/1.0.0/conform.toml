# conform.toml — политика дисциплины этого пакетного воркспейса.
#
# Движок дисциплины наводится на собственные исходники (B-057). Авторский код
# этого пакета — ровно один крейт; всё прочее в `crates/` — байт-идентичные
# копии, чей авторский дом объявлен в `sync-engines.toml` и чей гейт стоит
# именно там. Поэтому периметр скана назван литерально — одним авторским
# крейтом, — и вендор-копии в него просто не входят, а не «входят и
# освобождаются»: так находка никогда не ложится на адрес, который править
# запрещено.

max_file_lines = 600

[rust]
roots = ["crates/rust-ai-native-mcp"]
exclude_substrings = ["/generated/"]

gated = ["rust-ai-native-mcp"]
