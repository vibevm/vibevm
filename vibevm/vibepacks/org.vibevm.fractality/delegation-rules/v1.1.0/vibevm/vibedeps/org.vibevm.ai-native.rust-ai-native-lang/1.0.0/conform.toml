# conform.toml — посадочная политика дисциплины этого пакетного воркспейса.
#
# Движок дисциплины наводится на собственные исходники (B-057). Слот авторский:
# вендор-копий на уровне `crates/*` он не держит (вендор-копии движка лежат в
# `crates/vendor/`, у которого нет своих src/ и tests/, — поэтому сканер его не
# видит; см. RP1 первого замера).
#
# Посадочный принцип — «расширяемый по мере готовности список», как в хостовой
# политике проекта: под гейтом стоят крейты, уже приведённые к дисциплине;
# крейты с долгом объявлены в `[[rust.exempt]]` С ПРИЧИНОЙ, чтобы долг был
# назван, а не заморожен молча. В baseline (conform-baseline.json) заморожены
# только находки правил, которые на список `gated` не смотрят (file-length) —
# это настоящий остаточный долг.

max_file_lines = 600

[rust]
roots = ["crates/*"]
exclude_substrings = ["/generated/"]
# Аудит-дом для env-мутаций и unsafe: крейт существует ровно затем, чтобы
# держать их за безопасной API, и все такие находки сидят в одном его файле
# (lib.rs). Он освобождён от unsafe-gate/ambient-env по audit_crates — это
# исправление классификации, а не ослабление правила (ровно как audit_crates в
# хостовой политике проекта).
audit_crates = ["rust-ai-native-env-audit"]

gated = [
    "rust-ai-native-cli",
    "rust-ai-native-conform-frontend",
    "rust-ai-native-env-audit",
]

[[rust.exempt]]
unit = "rust-ai-native-conform"
reason = "ещё не приведён к дисциплине: 4 находки (seam-has-doctest). Входит в gated, когда швы обретут доктесты, а слой ошибок — ссылки на требования"

[[rust.exempt]]
unit = "rust-ai-native-specmap"
reason = "ещё не приведён к дисциплине: 2 находки (seam-has-doctest). Входит в gated, когда швы обретут доктесты, а слой ошибок — ссылки на требования"

[[rust.exempt]]
unit = "rust-ai-native-tcg-bridge"
reason = "ещё не приведён к дисциплине: 2 находки (seam-has-doctest). Входит в gated, когда швы обретут доктесты, а слой ошибок — ссылки на требования"

[[rust.exempt]]
unit = "rust-ai-native-tcg"
reason = "ещё не приведён к дисциплине: 13 находок (seam-has-doctest, ambient-env). Входит в gated, когда швы обретут доктесты, а слой ошибок — ссылки на требования"
