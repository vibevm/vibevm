[package]
name = "conflict-protocol"
group = "org.vibevm.world"
kind = "flow"
version = "1.0.0"
epoch = 1
authors = ["Oleg Chirukhin"]
license = "UPL-1.0"
description = "Conflict resolution for two writers on one file set: Human > Spec > Tests > Code, REVIEW markers, and the conservative-default uncertainty path"
keywords = ["conflicts", "review-markers", "priorities", "spec-driven", "uncertainty"]

[compatibility]
min_vibe_version = "0.1.0"
requires_kinds = []

[boot_snippet]
source = "vibevm/vibespecs/boot/35-flow-conflict-protocol.xml"

category = "flow"

[[boot_snippet.fragment]]
source = "vibevm/vibespecs/boot/35a-wal-binding.xml"
when = "installed:org.vibevm.world/wal"

