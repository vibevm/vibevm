[package]
name = "codex-subagents"
group = "org.vibevm.world"
kind = "tool"
version = "1.1.0"
epoch = 1
format = "normal"
authors = ["Oleg Chirukhin"]
license = "UPL-1.0"
description = "Isolated Codex CLI launchers and a bounded parent/worker contract with automatic boot suppression"
keywords = ["codex", "delegation", "subagents", "bounded-tasks"]

[compatibility]
min_vibe_version = "1.0.0"
requires_kinds = []

[boot_snippet]
source = "vibevm/vibespecs/boot/78-tool-codex-subagents.xml"
category = "tool"

[[artifacts.package]]
id = "codex-worker-powershell"
mechanism = "package:static-file"
inputs = [{ path = "launchers/codex-worker.ps1" }]
outputs = [{ id = "codex-worker.ps1", kind = "file" }]

[[artifacts.package]]
id = "codex-worker-command"
mechanism = "package:static-file"
inputs = [{ path = "launchers/codex-worker.cmd" }]
outputs = [{ id = "codex-worker.cmd", kind = "file" }]

[[artifacts.package]]
id = "codex-worker-posix"
mechanism = "package:static-file"
inputs = [{ path = "launchers/codex-worker" }]
outputs = [{ id = "codex-worker", kind = "file" }]

[[deploy.target]]
id = "codex-worker-powershell"
artifact = "codex-worker.ps1"
mechanism = "deploy:vibe-opt-launcher"

[[deploy.target]]
id = "codex-worker-command"
artifact = "codex-worker.cmd"
mechanism = "deploy:vibe-opt-launcher"
depends_on = ["codex-worker-powershell"]

[[deploy.target]]
id = "codex-worker-posix"
artifact = "codex-worker"
mechanism = "deploy:vibe-opt-launcher"

[deploy.profiles.windows]
targets = ["codex-worker-powershell", "codex-worker-command"]

[deploy.profiles.posix]
targets = ["codex-worker-posix"]
