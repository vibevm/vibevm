# conform.toml — this project's AI-Native discipline policy
# (ENGINE-CONFORM; generated by `typescript-ai-native init`, then owned by you).
#
# The [typescript] table drives the ts-tsc structural gate
# (`typescript-ai-native-conform`): the §8 unsafe-set ban, cell isolation over
# import specifiers, and the file-length budget. Rust-side keys stay
# at their defaults until Rust code joins the tree.

max_file_lines = 600

[typescript]
roots = ["src"]
exclude_substrings = ["/fixtures/"]
# The demo is fully adopted: every on-disk cell is gated (none exempt).
gated = ["farewell", "greeting"]
cells_dir = "src/cells"
seam = "index"
# The one legal site for env/config reads (R-001 / GUIDE §7, B-039): the
# composition root. Setting this mounts the `ts-flag-sites` rule, which
# flags any `process.env` / `import.meta.env` read in a scanned file
# outside this one. `src/main.ts` lives outside `cells_dir`, so the
# on-disk cell set (greeting, farewell) is unchanged.
composition_root = "src/main.ts"
