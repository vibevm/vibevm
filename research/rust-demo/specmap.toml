# specmap.toml — this project's traceability policy
# (PROP-014; generated by `rust-ai-native init`, then owned by you).

# The spec:// namespace this project's units are minted under.
namespace = "rust-demo"

# Code roots scanned for tags: crate dirs, named explicitly (the
# scanner walks each crate's src/ + tests/).
scan_roots = ["crates/rust-demo"]
spec_roots = ["spec"]
root_spec_docs = []
exempt = []
dispositioned = []

# Installed packages' spec trees, read for URI RESOLUTION only
# (PROP-014 §7.1) — discovered from vibevm/vibedeps/ at init time.
[[external_specs]]
namespace = "org.vibevm.ai-native/core-ai-native"
root = "vibevm/vibedeps/org.vibevm.ai-native.core-ai-native/1.0.0/vibevm/vibespecs"

[[external_specs]]
namespace = "org.vibevm.ai-native/rust-ai-native-lang"
root = "vibevm/vibedeps/org.vibevm.ai-native.rust-ai-native-lang/1.0.0/vibevm/vibespecs"
