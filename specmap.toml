# specmap.toml — vibevm's traceability scan + orphan-ratchet policy.
#
# The specmap engine (PROP-014) is config-driven (Traceability Relocation Plan,
# Phase 2): this file is the policy for THIS project — which source roots carry
# taggable code, which markdown trees hold spec units, and which crates are
# exempt from the orphan gate. It supersedes the former specmap-ratchet.json
# (its exempt/dispositioned data folded in here). A consumer of the
# rust-ai-native stack writes its own specmap.toml for its own layout — the
# same posture conform.toml takes (PROP-024; the policy stays with the
# consumer, the engine ships in the package).

# The spec:// namespace this project's units are minted under — the
# `<package>` segment of every `spec://org.vibevm.core/vibevm/…` URI (PROP-014 §2.1).
namespace = "org.vibevm.core/vibevm"

# Code roots scanned for #[spec]/#[verifies]/scope! tags. A `<dir>/*` entry
# scans each subdir of <dir> as one crate; any other entry is a literal dir.
scan_roots = ["crates/*", "xtask"]

# Markdown trees walked for anchored spec units (<root>/**/*.md).
spec_roots = ["spec"]

# Enumerated exclusions, applied after both include halves above. The include
# side is enumerated so nothing is indexed by accident, and an enumerated
# exclude serves that purpose exactly as well — not a wildcard escape hatch.
# A pattern that stops matching anything says so by name on every run
# (`stale-exclude`); delete it then rather than leaving a dead one behind.
#
# The sibling gate had already excluded both of these, by owner ruling
# 2026-07-24 recorded at the top of `progress.toml`, and this list had not
# mirrored it — the third instance of two gates holding two exclusion lists.
# It was found by the gate `specmap --check` itself, which went red on the
# first panel run after it was installed.
#
#   spec/WAL.md       — the session checkpoint, REWRITTEN WHOLE at every
#                       wind-down. Measured 2026-08-05: it minted 71 units
#                       carrying ZERO edges, and each wind-down moved ~46 of
#                       them, so the last commit of every session invalidated
#                       the committed index and the next session opened on a
#                       red panel. An address that dies within a day is not a
#                       traceability address; the project's own law already
#                       says a brief may not cite this file.
#   spec/boot/STATIC.md — compiler output (`vibe install` rewrites it whole;
#                       its own first line says so). Measured the same day:
#                       572 units, ZERO edges, and every one of them a
#                       compiled copy of a package snippet that already
#                       resolves through `[[external_specs]]` under its own
#                       address. Indexing it makes this project's index claim
#                       572 units it neither authored nor can edit.
#
# `spec/boot/INDEX.md` is deliberately NOT here: it is a TOML manifest and
# mints no units, so an exclusion for it would be born stale.
spec_exclude = ["spec/WAL.md", "spec/boot/STATIC.md"]

# Individual root-level spec documents scanned in addition to spec_roots — the
# owner-frozen implementation spec lives at the repo root, outside any spec/
# tree (DBT-0019, closed 2026-06-12 when mdspec began scanning it).
root_spec_docs = ["VIBEVM-SPEC.md"]

# Crates exempt from the orphan ratchet (PLAYBOOK #phase2, flipped 2026-06-10).
# A crate NOT listed is gated: its pub items must carry an own edge or a
# scope!-inherited module edge. Each exemption and why:
#   vibe-graph, vibe-llm  — M0 stub crates, no code yet
#   vibe-wire             — generated code. PROP-014 §2.3 designates the JTD
#                           schema the taggable unit instead; measured
#                           2026-08-05, no schema carries a tag and no scanner
#                           reads .json, so that half is a decision, not a
#                           description (B-060). The exemption rests on the
#                           generated-code half alone.
#   xtask                 — internal tooling binary (panics ok at the dev console)
#   vibe-spec             — the PROP-035 spec compiler, provisional: not yet
#                           spec-tagged or REQ-edged, and §15's migration puts
#                           vibevm's own adoption last. Exempt in conform.toml for
#                           that exact reason and mirrored here 2026-08-05 (B-014):
#                           the two lists are meant to move together, and this one
#                           had not, which nothing noticed because the host's own
#                           ratchet had never been run. It leaves both lists
#                           together, when the format stabilises.
#   vibe-test-support     — test-only, consumed solely as a dev-dependency and
#                           shipped in no binary (DRIFT-020); it has no product
#                           surface for a spec URI to point at. Same reason it
#                           is exempt in conform.toml, kept in step with it.
# (core-ai-native-specmark + core-ai-native-specmark-grammar relocated into
#  flow:org.vibevm.ai-native/core-ai-native in the traceability + engine-consolidation
#  moves, so they are no longer vibevm crates to exempt here; the packages
#  trace their own crates via the self-trace gate.)
exempt = [
    "vibe-graph",
    "vibe-llm",
    "vibe-spec",
    "vibe-test-support",
    "vibe-wire",
    "xtask",
]

# Orphans allowed to stand, each carrying its debt id (the "dispositioned into
# debt.json" arm of the Phase 2 acceptance). Empty today — every gated crate's
# public surface is fully tagged.
dispositioned = []

# Installed packages' spec trees, read for URI RESOLUTION only (PROP-014
# §7.1): edges into `spec://org.vibevm.ai-native/core-ai-native/…` — the shipped mechanism specs
# this repo's tags cite — resolve through the materialised slot instead of
# dangling. Units found here never enter the committed specmap.json.
[[external_specs]]
namespace = "core-ai-native"
root = "vibedeps/flow-core-ai-native/0.8.0/spec"
