# px — the single-sign-on proxy bridge a vibe distribution carries as
# `tools/px/` (PROP-068#proxy). px is NOT committed to this repository: this
# manifest pins the upstream release, and `cargo xtask dist px` fetches the
# asset for one target, verifies its SHA-256 against this file, and lays it
# out with px's MIT LICENSE and a NOTICE line. Digests are the GitHub release
# API `digest` values, re-measured on 2026-11-08.
#
# Upstream: https://github.com/genotrance/px (MIT, Copyright (c) 2017-2026
# Ganesh Viswanathan). v0.11.0 is the latest stable (non-pre-release) tag.
# There is no macOS x86_64 asset: that target uses a system px
# (`pip install px-proxy`) named by `[proxy] px_path`.

schema = 1
name = "px"
version = "0.11.0"
homepage = "https://github.com/genotrance/px"
license = "MIT"
license_url = "https://github.com/genotrance/px/raw/refs/tags/v0.11.0/LICENSE.txt"
license_sha256 = "573a63dafd23b9aff82fb76181d678bcc6488ad0be309458024dd57690621fa9"
notice = "This distribution includes px 0.11.0 (https://github.com/genotrance/px), Copyright (c) 2017-2026 Ganesh Viswanathan, under the MIT License; see tools/px/LICENSE.txt."

